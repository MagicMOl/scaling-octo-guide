<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>首页 C · 大字海报</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--paper:#F2EADA;--ink:#1C1913;--soft:#8A7E62;--rule:#D9CFBC}
  body{width:393px;height:852px;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;position:relative}
  .sb{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:11px;font-weight:600}
  .sb .r{display:flex;gap:5px;align-items:center}
  .sb i{display:block;width:22px;height:10px;border:1px solid var(--ink);border-radius:2px;position:relative}
  .sb i::after{content:'';position:absolute;inset:1.5px 8px 1.5px 1.5px;background:var(--ink);opacity:.75}

  .top{padding:20px 26px 0;display:flex;justify-content:space-between;align-items:baseline;
    font-size:9.5px;letter-spacing:.3em;color:var(--soft)}
  .top b{font-weight:400;color:var(--ink)}

  .poster{flex:1;padding:0 26px;display:flex;align-items:center}
  .num{position:relative;display:flex;align-items:flex-start;gap:10px}
  .num b{display:block;font-family:"Noto Serif SC","Songti SC",serif;font-size:180px;line-height:.86;font-weight:600;letter-spacing:-.05em}
  .num em{font-style:normal;writing-mode:vertical-rl;margin-top:14px;
    font-family:"Noto Serif SC",serif;font-size:26px;letter-spacing:.34em;color:var(--soft)}
  .num i{position:absolute;left:0;bottom:-16px;width:calc(100% - 46px);height:1px;background:var(--ink);opacity:.4}

  .quote{padding:0 26px;margin-top:14px}
  .quote p{font-family:"Noto Serif SC","Songti SC",serif;font-size:14px;line-height:2;color:#4A4334}
  .quote span{display:block;margin-top:12px;font-size:9.5px;letter-spacing:.24em;color:var(--soft)}

  .cta{margin:26px 26px 0;padding-top:18px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center}
  .cta span{font-size:11px;letter-spacing:.2em}
  .cta i{width:34px;height:1px;background:var(--ink);position:relative}
  .cta i::after{content:'';position:absolute;right:0;top:-3px;width:6px;height:6px;border-top:1px solid var(--ink);border-right:1px solid var(--ink);transform:rotate(45deg)}

  .tabs{margin-top:22px;height:64px;border-top:1px solid var(--rule);display:flex;align-items:center;justify-content:space-around;
    font-size:10px;letter-spacing:.14em;color:#B3AA97}
  .tabs .on{color:var(--ink);position:relative}
  .tabs .on::after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:-9px;width:16px;height:1px;background:var(--ink)}
</style>
</head>
<body>
  <div class="sb"><span>9:41</span><div class="r"><span>◍</span><span>▮▮▮</span><i></i></div></div>

  <div class="top"><span><b>寻找人生的</b></span><span>二〇二六</span></div>

  <div class="poster">
    <div class="num">
      <b>25</b>
      <em>号底片</em>
      <i></i>
    </div>
  </div>

  <div class="quote">
    <p>每个人的底片里，<br>都有一格还没显影。</p>
    <span>把它找出来，照亮接下来的十年</span>
  </div>

  <div class="cta"><span>走进路口</span><i></i></div>
  <div class="tabs"><span class="on">路口</span><span>底片</span><span>项目</span><span>我</span></div>
</body>
</html>
