<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>首页 D · 夜里路口</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--night:#111110;--ink:#EDE7DA;--soft:#8A8377;--blue:#6E9BC0}
  body{width:393px;height:852px;background:var(--night);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;position:relative}
  .sb{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:11px;font-weight:600;position:relative;z-index:3}
  .sb .r{display:flex;gap:5px;align-items:center}
  .sb i{display:block;width:22px;height:10px;border:1px solid var(--ink);border-radius:2px;position:relative}
  .sb i::after{content:'';position:absolute;inset:1.5px 8px 1.5px 1.5px;background:var(--ink);opacity:.75}

  .scene{position:absolute;inset:0;overflow:hidden}
  /* 四条斑马线 */
  .zebra{position:absolute;left:50%;top:50%;width:640px;height:58px;transform-origin:50% 50%;
    background:repeating-linear-gradient(90deg,rgba(237,231,218,.055) 0 10px,transparent 10px 28px)}
  .z{transform:translate(-50%,-50%) rotate(0deg)}
  .z1{transform:translate(-50%,-50%) rotate(0deg)}
  .z2{transform:translate(-50%,-50%) rotate(90deg)}
  .z3{transform:translate(-50%,-50%) rotate(45deg)}
  .z4{transform:translate(-50%,-50%) rotate(-45deg)}
  /* 路灯余光 */
  .glow{position:absolute;left:50%;top:50%;width:520px;height:520px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(237,231,218,.10),rgba(237,231,218,.02) 42%,transparent 66%)}
  /* 钟 */
  .clock{position:absolute;left:50%;top:50%;width:236px;height:236px;transform:translate(-50%,-50%);z-index:2;
    border-radius:50%;border:1px solid rgba(237,231,218,.22)}
  .clock::before{content:'';position:absolute;inset:7px;border-radius:50%;border:1px solid rgba(237,231,218,.10)}
  .tick{position:absolute;left:50%;top:0;width:1px;height:6px;background:rgba(237,231,218,.28);transform-origin:50% 118px}
  .tick.maj{height:10px;width:1.4px;background:rgba(237,231,218,.55)}
  .hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:2px}
  .hh{width:2px;height:56px;background:rgba(237,231,218,.85);transform:translateX(-1px) rotate(52deg)}
  .mm{width:1.4px;height:82px;background:rgba(237,231,218,.5);transform:translateX(-0.7px) rotate(-24deg)}
  .ss{width:1px;height:96px;background:#B03A28;opacity:.8;transform:translateX(-0.5px) rotate(148deg)}
  .dots{position:absolute;left:50%;top:50%;width:0;height:0}
  .dot{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(237,231,218,.55);transform:translate(-50%,-50%)}
  .dot.pair::after{content:'';position:absolute;left:10px;top:0;width:3px;height:3px;border-radius:50%;background:inherit}

  .content{position:relative;z-index:3;margin-top:auto;padding:0 26px 30px}
  .content::before{content:"";position:absolute;left:0;right:0;bottom:0;height:100%;z-index:-1;
    background:linear-gradient(to top,var(--night) 42%,rgba(17,17,16,.86) 68%,rgba(17,17,16,0) 100%)}
  .kicker{font-size:9.5px;letter-spacing:.34em;color:rgba(237,231,218,.5)}
  h1{margin-top:14px;font-family:"Noto Serif SC","Songti SC",serif;font-size:36px;line-height:1.42;font-weight:600}
  h1 em{font-style:normal;color:var(--blue)}
  .sub{margin-top:12px;font-size:11.5px;line-height:1.95;color:rgba(237,231,218,.55)}
  .cta{margin-top:26px;height:48px;border:1px solid rgba(237,231,218,.35);display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;font-size:12px;letter-spacing:.2em}
  .cta i{width:26px;height:1px;background:rgba(237,231,218,.6);position:relative}
  .cta i::after{content:'';position:absolute;right:0;top:-3px;width:6px;height:6px;border-top:1px solid rgba(237,231,218,.6);border-right:1px solid rgba(237,231,218,.6);transform:rotate(45deg)}
  .tabs{margin-top:20px;height:64px;border-top:1px solid rgba(237,231,218,.12);display:flex;align-items:center;justify-content:space-around;
    font-size:10px;letter-spacing:.14em;color:rgba(237,231,218,.35)}
  .tabs .on{color:var(--ink);position:relative}
  .tabs .on::after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:-9px;width:16px;height:1px;background:var(--ink)}
</style>
</head>
<body>
  <div class="scene">
    <div class="glow"></div>
    <div class="zebra z1"></div><div class="zebra z2"></div>
    <div class="clock" id="clock">
      <div class="hand hh"></div><div class="hand mm"></div><div class="hand ss"></div>
    </div>
    <div class="dots" id="dots"></div>
  </div>

  <div class="sb"><span>9:41</span><div class="r"><span>◍</span><span>▮▮▮</span><i></i></div></div>

  <div class="content">
    <div class="kicker">路口 · 23:41</div>
    <h1>每个人都在路口，<br>只是<em>钟不一样</em>。</h1>
    <p class="sub">十一年，五个年份，四格已显影。<br>剩下的，等你走到。</p>
    <div class="cta"><span>走进路口</span><i></i></div>
    <div class="tabs"><span class="on">路口</span><span>底片</span><span>项目</span><span>我</span></div>
  </div>

<script>
  const clock = document.getElementById('clock');
  for (let i = 0; i < 60; i++) {
    const t = document.createElement('div');
    t.className = 'tick' + (i % 5 === 0 ? ' maj' : '');
    t.style.transform = `rotate(${i * 6}deg)`;
    clock.appendChild(t);
  }
  // 六个行人在斑马线附近
  const dots = document.getElementById('dots');
  const people = [[-150,-116],[-96,86],[74,-132],[128,64],[-190,40],[176,-58]];
  people.forEach(([x, y]) => {
    const d = document.createElement('div');
    d.className = 'dot pair';
    d.style.transform = `translate(${x}px,${y}px)`;
    dots.appendChild(d);
  });
</script>
</body>
</html>
