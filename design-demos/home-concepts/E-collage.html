<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>首页 E · 手账拼贴</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--paper:#F6EFDF;--ink:#1C1913;--soft:#7E7358;--blue:#2B5C86;--yellow:#F5C43C;--orange:#D97B2E;--green:#6E8F3C}
  body{width:393px;height:852px;background:var(--paper);color:var(--ink);overflow:hidden;position:relative;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background-image:radial-gradient(rgba(28,25,19,.08) 1px,transparent 1px);background-size:11px 11px}
  .sb{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 6px;
    font-size:11px;font-weight:600;position:relative;z-index:5}
  .sb .r{display:flex;gap:5px;align-items:center}
  .sb i{display:block;width:22px;height:10px;border:1px solid var(--ink);border-radius:3px;position:relative}
  .sb i::after{content:'';position:absolute;inset:1.5px 8px 1.5px 1.5px;background:var(--ink);opacity:.8}

  .tape{position:absolute;width:96px;height:26px;z-index:1}
  .t1{left:-18px;top:96px;transform:rotate(-9deg);background:rgba(245,196,60,.55)}
  .t2{right:-22px;top:228px;transform:rotate(7deg);background:rgba(110,143,60,.42)}
  .t3{left:242px;top:604px;transform:rotate(-4deg);background:rgba(43,92,134,.26)}

  .hd{position:relative;padding:22px 26px 0;z-index:3}
  .k{display:inline-block;font-size:9.5px;letter-spacing:.26em;color:var(--soft);
    border:1px solid rgba(28,25,19,.25);padding:4px 8px;transform:rotate(-2deg)}
  h1{position:relative;z-index:2;margin-top:16px;font-family:"Noto Serif SC","Songti SC",serif;
    font-size:40px;line-height:1.34;font-weight:700;letter-spacing:-.01em}
  h1 em{font-style:normal;position:relative;white-space:nowrap}
  h1 em::after{content:'';position:absolute;left:-4px;right:-4px;bottom:5px;height:14px;
    background:linear-gradient(90deg,rgba(245,196,60,.85),rgba(245,196,60,.55));z-index:-1;transform:skewX(-6deg)}
  .sub{margin-top:14px;font-size:12.5px;line-height:1.95;color:#5C5342}

  .ticket{position:relative;margin:26px 26px 0;background:#fff;border:1px solid rgba(28,25,19,.16);
    transform:rotate(-1.6deg);box-shadow:3px 4px 0 rgba(28,25,19,.07);z-index:2}
  .ticket .row{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
  .ticket .big{font-family:"Noto Serif SC",serif;font-size:38px;font-weight:700;line-height:1;letter-spacing:-.02em}
  .ticket .big i{font-style:normal;font-size:14px;color:var(--soft);margin-left:2px}
  .ticket .lab{font-size:10.5px;line-height:1.7;color:#5C5342}
  .ticket .dot{width:1px;height:34px;background:repeating-linear-gradient(180deg,rgba(28,25,19,.22) 0 4px,transparent 4px 8px)}
  .cells{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;padding:0 16px 14px}
  .cells i{aspect-ratio:1/1;border-radius:2px}
  .cells i.on{background:var(--ink)}
  .cells i.blue{background:var(--blue)}
  .cells i.green{background:var(--green)}
  .cells i.orange{background:var(--orange)}
  .cells i.off{background:transparent;border:1px dashed rgba(28,25,19,.25)}

  .note{position:absolute;left:26px;right:26px;top:560px;z-index:2}
  .note b{display:block;font-family:"Noto Serif SC",serif;font-size:15px;font-weight:700;letter-spacing:.02em}
  .note span{display:block;margin-top:6px;font-size:11.5px;line-height:1.85;color:#6B6152}

  .cta{position:absolute;left:26px;right:26px;bottom:96px;height:54px;border-radius:27px;background:var(--ink);
    color:var(--paper);display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:14px;letter-spacing:.16em;font-weight:600;box-shadow:0 5px 0 rgba(28,25,19,.18)}
  .cta b{font-weight:400;font-size:19px;line-height:1}

  .tabs{position:absolute;left:0;right:0;bottom:0;height:64px;border-top:1px solid rgba(28,25,19,.12);
    display:flex;align-items:center;justify-content:space-around;font-size:10px;letter-spacing:.14em;color:#B0A78F}
  .tabs .on{color:var(--ink);font-weight:600}
</style>
</head>
<body>
  <div class="sb"><span>9:41</span><div class="r"><span>◍</span><span>▮▮▮</span><i></i></div></div>
  <div class="tape t1"></div><div class="tape t2"></div><div class="tape t3"></div>

  <div class="hd">
    <span class="k">25 号底片 · 第 25 格</span>
    <h1>你的人生，<br>还空着<em>二十一格</em>。</h1>
    <p class="sub">已经冲洗的 4 格都在这儿了。空着的那些，随时可以补上。</p>
  </div>

  <div class="ticket">
    <div class="row">
      <div class="big">4<i>/25</i></div>
      <div class="dot"></div>
      <div class="lab">2015 文案<br>2018 访谈<br>2021 组件<br>2024 定价</div>
    </div>
    <div class="cells">
      <i class="on"></i><i class="blue"></i><i class="green"></i><i class="orange"></i>
      <i class="off"></i><i class="off"></i><i class="off"></i><i class="off"></i>
      <i class="off"></i><i class="off"></i><i class="off"></i><i class="off"></i>
      <i class="off"></i><i class="off"></i><i class="off"></i><i class="off"></i>
    </div>
  </div>

  <div class="note">
    <b>空着的 21 格</b>
    <span>可以从任意一年开始补。先写一句那天在做什么，就够了。</span>
  </div>

  <div class="cta">开始冲洗第一格 <b>›</b></div>
  <div class="tabs"><span class="on">路口</span><span>底片</span><span>项目</span><span>我</span></div>
</body>
</html>
