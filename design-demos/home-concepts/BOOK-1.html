<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>封面 · 长曝光（居中版）</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--paper:#F4EDDE;--ink:#22262E;--blue:#3A4A5C;--soft:#8A8271;--line:#DED3BE}
  body{width:393px;height:852px;background:var(--paper);color:var(--ink);overflow:hidden;position:relative;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  .sb{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 6px;
    font-size:11px;font-weight:600;position:relative;z-index:6;color:#2A2E36}
  .sb .r{display:flex;gap:5px;align-items:center}
  .sb i{display:block;width:22px;height:10px;border:1px solid #2A2E36;border-radius:3px;position:relative}
  .sb i::after{content:'';position:absolute;inset:1.5px 8px 1.5px 1.5px;background:#2A2E36;opacity:.8}

  .scene{position:absolute;left:0;right:0;top:0;height:438px;overflow:hidden}
  .scene svg{width:100%;height:100%;display:block}
  .fade{position:absolute;left:0;right:0;bottom:0;height:74px;
    background:linear-gradient(to bottom,rgba(244,237,222,0),var(--paper))}

  .type{position:absolute;left:0;right:0;top:462px;text-align:center;z-index:3}
  .author{font-size:9px;letter-spacing:.36em;color:var(--blue);font-weight:600}
  .title{margin-top:22px;display:inline-block;position:relative;
    font-family:"Noto Serif SC","Songti SC",serif;font-weight:300;
    font-size:42px;line-height:1.5;letter-spacing:.16em;color:var(--ink)}
  .slash{position:absolute;width:1px;background:rgba(58,74,92,.28)}
  .s1{left:-34px;top:4px;height:76px;transform:rotate(-17deg)}
  .s2{right:-30px;bottom:8px;height:54px;transform:rotate(-17deg)}
  .sub{margin-top:20px;font-size:11px;line-height:2;color:#6F6858;letter-spacing:.08em}

  .enter{position:absolute;left:0;right:0;bottom:96px;text-align:center;z-index:3}
  .enter span{font-size:10px;letter-spacing:.32em;color:#7A7261}
  .enter .rule{width:1px;height:22px;background:rgba(58,74,92,.35);margin:14px auto 0}

  .tabs{position:absolute;left:0;right:0;bottom:0;height:66px;border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-around;font-size:10px;letter-spacing:.16em;
    color:#ADA28B;z-index:5;background:var(--paper)}
  .tabs .on{color:var(--ink)}
</style>
</head>
<body>
  <div class="scene">
    <svg viewBox="0 0 393 438" preserveAspectRatio="xMidYMid slice">
      <defs>
        <filter id="b1" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="1 0.12"/>
        </filter>
        <filter id="b2" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="2.8 0.35"/>
        </filter>
        <filter id="b3" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="5.5 0.7"/>
        </filter>
        <!-- 行人：脚在原点，肩线下收，双腿分开 -->
        <g id="p">
          <g stroke-linecap="round">
            <circle cx="0" cy="-63" r="4.3"/>
            <path d="M-7.5 -55 q7.5 -4 15 0 l4 17 -2.5 13 -4 0 -1 -11 -0.5 11 -4 0 -0.5 -11 -4 0 -2.5 -13 z"/>
            <path d="M-3 -22 L-6.5 0" stroke-width="4.2" fill="none"/>
            <path d="M3 -22 L7 0" stroke-width="4.2" fill="none"/>
            <path d="M-6 -44 L-9 -26" stroke-width="2.6" fill="none" opacity=".8"/>
            <path d="M6 -44 L9.5 -30" stroke-width="2.6" fill="none" opacity=".8"/>
          </g>
        </g>
      </defs>

      <rect width="393" height="438" fill="#F4EDDE"/>

      <!-- 路面只留底部一条 -->
      <rect x="0" y="326" width="393" height="112" fill="#E7DAC0"/>
      <g fill="#FDF8EC" opacity=".95">
        <rect x="-40" y="342" width="480" height="6"/>
        <rect x="-40" y="360" width="480" height="6"/>
        <rect x="-40" y="378" width="480" height="6"/>
        <rect x="-40" y="396" width="480" height="6"/>
      </g>

      <!-- 远景：小而淡 -->
      <g filter="url(#b3)" fill="#3A4A5C" opacity=".2">
        <use href="#p" transform="translate(44 132) scale(.55)"/>
        <use href="#p" transform="translate(118 126) scale(.5)"/>
        <use href="#p" transform="translate(196 134) scale(.58)"/>
        <use href="#p" transform="translate(268 124) scale(.52)"/>
        <use href="#p" transform="translate(340 132) scale(.56)"/>
      </g>

      <!-- 中景 -->
      <g filter="url(#b2)" fill="#313D4C" opacity=".38">
        <use href="#p" transform="translate(20 232) scale(.86)"/>
        <use href="#p" transform="translate(96 218) scale(.8)"/>
        <use href="#p" transform="translate(170 240) scale(.9)"/>
        <use href="#p" transform="translate(248 222) scale(.84)"/>
        <use href="#p" transform="translate(330 236) scale(.88)"/>
      </g>

      <!-- 地面层 -->
      <g filter="url(#b2)" fill="#2B3542" opacity=".55">
        <use href="#p" transform="translate(36 362) scale(1.02)"/>
        <use href="#p" transform="translate(120 356) scale(.96)"/>
        <use href="#p" transform="translate(206 366) scale(1.05)"/>
        <use href="#p" transform="translate(288 358) scale(.98)"/>
      </g>

      <!-- 近景 -->
      <g filter="url(#b1)" fill="#1F2731" opacity=".9">
        <use href="#p" transform="translate(64 438) scale(1.55)" />
        <use href="#p" transform="translate(306 444) scale(1.62)" />
      </g>
      <g filter="url(#b2)" fill="#1F2731" opacity=".6">
        <use href="#p" transform="translate(196 430) scale(1.3)" />
      </g>

      <!-- 自行车 -->
      <g filter="url(#b1)" stroke="#2E3947" stroke-width="1.9" fill="none" opacity=".5">
        <circle cx="16" cy="396" r="17"/>
        <circle cx="62" cy="396" r="17"/>
        <path d="M16 396 L36 371 L56 371 M62 396 L56 371 L40 396 M36 371 L40 396"/>
      </g>

      <!-- 鸽子 -->
      <g filter="url(#b1)" fill="#2E3947" opacity=".55">
        <ellipse cx="152" cy="424" rx="5" ry="3.2"/>
        <path d="M157 422 l5.6 -1.7 -4 2.8z"/>
        <ellipse cx="262" cy="286" rx="4.6" ry="3"/>
        <path d="M266.5 284 l5.4 -1.5 -3.8 2.6z"/>
      </g>
    </svg>
    <div class="fade"></div>
  </div>

  <div class="sb"><span>9:41</span><div class="r"><span>◍</span><span>▮▮▮</span><i></i></div></div>

  <div class="type">
    <div class="author">25 号底片</div>
    <div class="title">
      <span class="slash s1"></span>
      先洗<br>一格
      <span class="slash s2"></span>
    </div>
    <p class="sub">十一年，四格已显影<br>还剩二十一格，等你走到</p>
  </div>

  <div class="enter">
    <span>轻触洗第一格</span>
    <div class="rule"></div>
  </div>

  <div class="tabs"><span class="on">封面</span><span>底片</span><span>项目</span><span>我</span></div>
</body>
</html>
