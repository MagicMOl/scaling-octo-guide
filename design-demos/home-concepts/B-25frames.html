<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>首页 B · 二十五格</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--paper:#F2EADA;--ink:#1C1913;--soft:#8A7E62;--blue:#2B5C86;--rule:#D9CFBC}
  body{width:393px;height:852px;background:#FFFFFF;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;overflow:hidden}
  .sb{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:11px;font-weight:600}
  .sb .r{display:flex;gap:5px;align-items:center}
  .sb i{display:block;width:22px;height:10px;border:1px solid var(--ink);border-radius:2px;position:relative}
  .sb i::after{content:'';position:absolute;inset:1.5px 8px 1.5px 1.5px;background:var(--ink);opacity:.75}

  .hd{padding:14px 26px 0}
  .hd .k{font-size:9.5px;letter-spacing:.32em;color:var(--soft)}
  .hd h1{margin-top:10px;font-family:"Noto Serif SC","Songti SC",serif;font-size:30px;line-height:1.35;font-weight:600}
  .hd h1 em{font-style:normal;color:var(--blue)}

  .gridwrap{flex:1;display:flex;align-items:center;justify-content:center;padding:0 26px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:100%}
  .cell{aspect-ratio:1/1;position:relative;background:#1B1711;display:flex;align-items:center;justify-content:center}
  .cell::before,.cell::after{content:'';position:absolute;left:0;right:0;height:3px;
    background:repeating-linear-gradient(90deg,#fff 0 3px,transparent 3px 9px);opacity:.5}
  .cell::before{top:2px}.cell::after{bottom:2px}
  .cell span{font-family:"Noto Serif SC",serif;font-size:9px;color:rgba(242,234,218,.55);letter-spacing:.08em}
  .cell.filled{background:#EFE7D6}
  .cell.filled::before,.cell.filled::after{opacity:.25;background:repeating-linear-gradient(90deg,#1C1913 0 3px,transparent 3px 9px)}
  .cell.filled span{color:rgba(28,25,19,.55)}
  .cell.empty{background:transparent;border:1px dashed rgba(28,25,19,.22)}
  .cell.empty::before,.cell.empty::after{display:none}
  .cell.target{background:transparent;border:1.5px dashed var(--blue)}
  .cell.target::before,.cell.target::after{display:none}

  .legend{padding:0 26px;display:flex;justify-content:space-between;align-items:baseline}
  .legend span{font-size:10px;color:var(--soft);letter-spacing:.06em}
  .legend b{font-family:"Noto Serif SC",serif;font-size:22px;font-weight:600;letter-spacing:-.01em}
  .legend b i{font-style:normal;font-size:11px;color:var(--soft);margin-left:2px}

  .cta{margin:16px 26px 0;height:46px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;
    font-size:12.5px;letter-spacing:.22em}
  .tabs{margin-top:20px;height:64px;border-top:1px solid var(--rule);display:flex;align-items:center;justify-content:space-around;
    font-size:10px;letter-spacing:.14em;color:#B3AA97}
  .tabs .on{color:var(--ink);position:relative}
  .tabs .on::after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:-9px;width:16px;height:1px;background:var(--ink)}
</style>
</head>
<body>
  <div class="sb"><span>9:41</span><div class="r"><span>◍</span><span>▮▮▮</span><i></i></div></div>

  <div class="hd">
    <div class="k">25 FRAMES</div>
    <h1>二十五格里，<br>你冲洗了<em>四格</em>。</h1>
  </div>

  <div class="gridwrap">
    <div class="grid" id="grid"></div>
  </div>

  <div class="legend">
    <span>2015 · 2018 · 2021 · 2024 已显影</span>
    <b>4<i>/25</i></b>
  </div>

  <div class="cta">冲洗下一格</div>
  <div class="tabs"><span class="on">路口</span><span>底片</span><span>项目</span><span>我</span></div>

<script>
  const grid = document.getElementById('grid');
  const filled = [0, 6, 12, 18];
  for (let i = 0; i < 25; i++) {
    const c = document.createElement('div');
    c.className = 'cell ' + (filled.includes(i) ? 'filled' : (i === 19 ? 'target' : 'empty'));
    if (filled.includes(i)) c.innerHTML = '<span>' + [2015, 2018, 2021, 2024][filled.indexOf(i)] + '</span>';
    grid.appendChild(c);
  }
</script>
</body>
</html>
