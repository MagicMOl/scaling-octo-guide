<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>寻找人生的 25 号底片</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #8B7E64; }
  body {
    color: #1C1913;
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* 整块版心按窗口缩放，任何预览尺寸都能看到完整界面 */
  #fit { position: fixed; inset: 0; }
  #board {
    position: absolute; left: 50%; top: 50%; width: 1800px; height: 1000px; overflow: hidden;
    transform-origin: center center; transform: translate(-50%, -50%);
    background: radial-gradient(120% 90% at 30% 10%, #C9BC9F 0%, #BCAE90 60%, #AB9C7E 100%);
    box-shadow: 0 24px 80px rgba(0,0,0,.35);
  }
  .serif { font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif; }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .5; z-index: 2;
    background-image: repeating-linear-gradient(0deg, rgba(120,100,60,.035) 0 1px, transparent 1px 3px),
                      repeating-linear-gradient(90deg, rgba(120,100,60,.025) 0 1px, transparent 1px 4px); }

  /* ---------- 底图：按用户给的两张参考图（黄昏湖面 / 水鸭青绿）取气氛 ---------- */
  .photo { position: absolute; inset: 0; z-index: 0; }
  .photo.dusk {
    background:
      radial-gradient(58% 34% at 50% 66%, rgba(255,248,230,.95) 0%, rgba(255,224,198,.5) 24%, rgba(255,212,190,0) 50%),
      radial-gradient(95% 55% at 50% 102%, rgba(186,138,168,.6), transparent 72%),
      linear-gradient(180deg, #E5B6C6 0%, #EFC6C6 24%, #F3CEC8 44%, #E0B1C1 70%, #C899B6 100%);
  }
  .photo.dusk::after {
    content: ""; position: absolute; left: 50%; top: 16%; width: 78px; height: 28%;
    transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,252,238,.92), rgba(255,236,210,.4) 55%, transparent 76%);
    filter: blur(9px);
  }
  .photo.water {
    background:
      radial-gradient(80% 52% at 24% 14%, rgba(216,250,242,.6), transparent 62%),
      radial-gradient(62% 44% at 78% 80%, rgba(146,210,202,.5), transparent 66%),
      linear-gradient(180deg, #1E6373 0%, #2A8390 30%, #4EA1A4 58%, #85C2BB 82%, #A8D5CB 100%);
  }
  .photo .ripple { position: absolute; inset: 0; opacity: .55;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.10) 0 1px, transparent 1px 10px); }
  .veil { position: absolute; inset: 0; z-index: 1; background: rgba(243,235,219,.64); }
  .veil.soft { background: rgba(243,235,219,.30); }
  .scr > .cov, .scr > .spiral, .scr > .proj, .scr > .team, .scr > .tech, .scr > .order { position: relative; z-index: 2; }

  /* ---------- 撕纸 ---------- */
  .tornw { position: absolute; filter: drop-shadow(0 2px 2px rgba(80,64,36,.18)) drop-shadow(0 8px 14px rgba(80,64,36,.12)); }
  .tornw::before { content: ""; position: absolute; inset: 0; background: #C4B696; clip-path: var(--tear); transform: translate(1.8px, 2.2px); z-index: 0; }
  .tear { position: absolute; inset: 0; z-index: 1; background: linear-gradient(158deg,#F9F3E5 0%,#F0E7D2 55%,#E6DBBF 100%); clip-path: var(--tear); }
  .tear .q { position: absolute; left: 12px; right: 12px; top: 10px; font-family: "Noto Serif SC","Songti SC",SimSun,serif; line-height: 1.75; }
  .tear .who { position: absolute; left: 12px; bottom: 9px; font-size: 8px; letter-spacing: .1em; color: #8A7E62; }

  /* ---------- 板面 ---------- */
  .board-title { position: absolute; left: 68px; top: 46px; z-index: 3; width: 400px; }
  .board-title h1 { font-family: "Noto Serif SC","Songti SC",SimSun,serif; font-size: 26px; font-weight: 500; letter-spacing: .14em; line-height: 1.5; }
  .board-title p { margin-top: 12px; font-size: 10px; letter-spacing: .2em; color: #8A7E62; }
  .board-foot { position: absolute; left: 72px; bottom: 24px; z-index: 3; font-size: 9.5px; color: #8A7E62; letter-spacing: .05em; }
  .flowline { position: absolute; height: 1px; background: rgba(60,48,24,.22); z-index: 3; }
  .flowstep { position: absolute; z-index: 4; font-size: 9.5px; letter-spacing: .2em; color: #8A7E62; }

  /* ---------- 手机 ---------- */
  .phone { width: 417px; height: 876px; padding: 12px; background: #000; border-radius: 60px; box-shadow: 0 0 0 2px #1f2937, 0 22px 60px rgba(60,48,24,.30); position: relative; }
  .screen { position: relative; width: 393px; height: 852px; border-radius: 48px; overflow: hidden; background: #FFFFFF; }
  .sbar { position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 20; color: #1C1913;
    display: flex; align-items: center; justify-content: space-between; padding: 0 32px;
    font: 600 16px/1 -apple-system, "SF Pro Text", sans-serif; pointer-events: none; }
  .island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; background: #000; border-radius: 999px; z-index: 30; }
  .content { position: absolute; top: 54px; left: 0; right: 0; bottom: 90px; overflow: hidden; }
  .home { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 140px; height: 5px; border-radius: 999px; background: rgba(28,25,19,.3); z-index: 10; }
  .sicons { display: flex; align-items: center; gap: 6px; }
  .sig { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
  .sig i { width: 3px; background: currentColor; border-radius: 1px; display: block; }
  .bat { width: 26px; height: 12px; border: 1.5px solid currentColor; border-radius: 3px; padding: 1px; position: relative; opacity: .8; }
  .bat b { display: block; width: 85%; height: 100%; background: currentColor; border-radius: 1px; opacity: .9; }
  .bat::after { content: ""; position: absolute; top: 3px; right: -3px; width: 2px; height: 6px; background: currentColor; border-radius: 0 1px 1px 0; }

  .scr { display: none; height: 100%; position: relative; }
  .scr.on { display: block; }
  .kicker { font-size: 10.5px; letter-spacing: .28em; color: #2B5C86; }
  .h1 { font-family: "Noto Serif SC","Songti SC",SimSun,serif; font-size: 24px; line-height: 1.5; font-weight: 500; }
  .h2 { font-family: "Noto Serif SC","Songti SC",SimSun,serif; font-size: 18px; line-height: 1.6; font-weight: 500; }
  .tiny { font-size: 11px; line-height: 1.8; color: #7E7258; }

  /* ---------- 封面 ---------- */
  .cov { height: 100%; position: relative; }
  .cov .road { position: absolute; left: -62px; right: -62px; top: 96px; height: 330px; }
  .cov .ht { position: absolute; left: 26px; top: 446px; }
  .cov .ht h2 { font-family: "Noto Serif SC","Songti SC",SimSun,serif; font-size: 38px; font-weight: 500; letter-spacing: .12em; line-height: 1; }
  .cov .ht p { margin-top: 16px; font-size: 11.5px; line-height: 1.95; color: #4A4334; }
  .cov .go { position: absolute; left: 26px; bottom: 22px; font-size: 12px; letter-spacing: .24em; cursor: pointer; padding-bottom: 8px; border-bottom: 1px solid #1C1913; }
  .cov .go:hover { opacity: .55; }

  /* ---------- 底片螺旋 ---------- */
  .spiral { position: relative; height: 100%; padding: 20px 0 0; }
  .spiral .hd { padding: 0 24px; }
  .coil { position: absolute; left: 0; top: 96px; right: 0; bottom: 0; }
  .coil .path { position: absolute; inset: 0; }
  .cell {
    position: absolute; width: 172px; height: 90px; background: #1B1711; border-radius: 3px; padding: 12px 9px;
    box-shadow: inset 0 0 0 1px rgba(240,230,205,.12), 0 8px 18px rgba(50,40,20,.22);
    display: flex; gap: 8px; cursor: pointer; transform-origin: 50% 50%;
  }
  .cell::before, .cell::after {
    content: ""; position: absolute; left: 5px; right: 5px; height: 6px;
    background: repeating-linear-gradient(90deg, rgba(240,230,205,.42) 0 6px, transparent 6px 14px);
  }
  .cell::before { top: 3px; }
  .cell::after { bottom: 3px; }
  .cell:hover { box-shadow: inset 0 0 0 1px rgba(240,230,205,.4), 0 8px 18px rgba(50,40,20,.22); }
  .cell .ph { width: 56px; height: 64px; flex: none; border-radius: 2px; overflow: hidden; background: #2C2519; position: relative; }
  .cell .ph img { width: 100%; height: 100%; object-fit: cover; display: block; filter: sepia(.35) contrast(1.05); }
  .cell .ph.add { display: flex; align-items: center; justify-content: center; color: #8C7A57; font-size: 9px; letter-spacing: .06em; border: 1px dashed rgba(240,230,205,.26); background: transparent; }
  .cell .txt { flex: 1; min-width: 0; }
  .cell .yr { position: relative; z-index: 1; font-family: "Noto Serif SC","Songti SC",SimSun,serif; font-size: 20px; color: #FFFFFF; line-height: 1; }
  .cell .sk { position: relative; z-index: 1; margin-top: 7px; font-size: 9px; line-height: 1.65; color: rgba(255,255,255,.74); }
  .cell .lv { position: relative; z-index: 1; margin-top: 6px; font-size: 8px; letter-spacing: .12em; color: #9CC6C9; }
  .coil .hint { position: absolute; left: 24px; bottom: 6px; font-size: 10px; color: #2B5C86; letter-spacing: .04em; }

  /* ---------- 立项 ---------- */
  .ask, .proj { padding: 20px 24px 0; }
  .bigbtn {
    width: 100%; background: #1C1913; color: #F4EBD6; border: 0; padding: 15px 0; font: 500 14px/1 inherit;
    letter-spacing: .3em; cursor: pointer; margin-top: 16px; transition: background .2s;
  }
  .bigbtn:hover { background: #3A3324; }
  .qs { margin-top: 14px; }
  .q { padding: 10px 0 8px; border-bottom: 1px solid rgba(28,25,19,.15); }
  .q .qq { font-family: "Noto Serif SC","Songti SC",SimSun,serif; font-size: 14px; line-height: 1.6; }
  .q .qa { margin-top: 7px; font-size: 11.5px; line-height: 1.8; color: #3E382A; }
  .q .qd { margin-top: 5px; font-size: 10px; color: #9A8E72; }
  .brief { margin-top: 12px; background: rgba(255,255,255,.4); box-shadow: inset 0 0 0 1px rgba(28,25,19,.12); padding: 14px 14px 12px; }
  .brief .lb { font-size: 9.5px; letter-spacing: .22em; color: #8A7E62; }
  .brief h3 { font-family: "Noto Serif SC","Songti SC",SimSun,serif; font-size: 16px; line-height: 1.55; margin-top: 8px; font-weight: 500; }
  .brief .row { display: flex; justify-content: space-between; font-size: 10.5px; padding: 6px 0; border-bottom: 1px solid rgba(28,25,19,.1); }
  .brief .row span:first-child { color: #8A7E62; }
  .brief .kv { display: flex; gap: 14px; margin-top: 10px; }
  .brief .kv div { flex: 1; }
  .brief .kv b { display: block; font-family: "Noto Serif SC",SimSun,serif; font-size: 17px; font-weight: 500; color: #B03A28; }
  .brief .kv span { font-size: 9px; color: #8A7E62; letter-spacing: .1em; }

  /* ---------- 团队 ---------- */
  .team { padding: 20px 24px 0; }
  .who { margin-top: 4px; }
  .ai { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(28,25,19,.10); }
  .ai .av { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 1px dashed #8A7E62; color: #6E6349;
    display: flex; align-items: center; justify-content: center; font-size: 11px; }
  .ai .in { flex: 1; min-width: 0; }
  .ai .nm { font-size: 11.5px; font-weight: 600; }
  .ai .nm i { font-style: normal; font-size: 8px; letter-spacing: .12em; border: 1px solid #2B5C86; color: #2B5C86;
    padding: 1px 4px; margin-left: 6px; vertical-align: 1px; }
  .ai .dc { font-size: 10px; color: #6E6349; margin-top: 2px; }
  .ai .st { font-size: 8.5px; color: #8A7E62; letter-spacing: .1em; flex: none; }
  .mem { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(28,25,19,.14); }
  .mem .av { width: 42px; height: 42px; flex: none; border-radius: 50%; background: #1C1913; color: #F4EBD6;
    display: flex; align-items: center; justify-content: center; font-size: 12px; letter-spacing: .02em; }
  .mem .in { flex: 1; }
  .mem .nm { font-size: 12.5px; font-weight: 600; }
  .mem .rl { font-size: 9.5px; color: #8A7E62; letter-spacing: .06em; margin-top: 2px; }
  .mem .rs { font-size: 10.5px; line-height: 1.7; color: #4A4334; margin-top: 5px; }
  .mem .mt { font-size: 9px; color: #8A7E62; margin-top: 5px; letter-spacing: .04em; }
  .mem .mt b { color: #B03A28; font-weight: 600; }
  .allin { margin-top: 16px; width: 100%; border: 1px solid #1C1913; background: none; color: #1C1913;
    padding: 13px 0; font: 500 12.5px/1 inherit; letter-spacing: .24em; cursor: pointer; }
  .allin:hover { background: #1C1913; color: #F4EBD6; }

  /* ---------- 技术 ---------- */
  .tech { padding: 22px 24px 0; }
  .grp { margin-top: 12px; }
  .grp .gl { font-size: 9.5px; letter-spacing: .24em; color: #8A7E62; }
  .it { padding: 10px 0; border-bottom: 1px solid rgba(28,25,19,.12); }
  .it .n { display: flex; justify-content: space-between; font-size: 12px; }
  .it .n b { font-weight: 500; }
  .it .n span { font-size: 9.5px; color: #8A7E62; letter-spacing: .04em; }
  .it .n span.price { color: #B03A28; font-variant-numeric: tabular-nums; }
  .it .w { font-size: 10px; color: #6E6349; line-height: 1.7; margin-top: 3px; }
  .sum { margin-top: 14px; font-size: 10.5px; color: #4A4334; }

  /* ---------- 下单 ---------- */
  .order { padding: 22px 24px 0; }
  .lines { margin-top: 14px; }
  .line { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; padding: 9px 0; border-bottom: 1px solid rgba(28,25,19,.12); }
  .line .l { color: #4A4334; }
  .line .l i { font-style: normal; display: block; font-size: 9px; color: #9A8E72; margin-top: 2px; }
  .total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px; }
  .total span { font-size: 10px; color: #8A7E62; letter-spacing: .18em; }
  .total b { font-family: "Noto Serif SC",SimSun,serif; font-size: 30px; font-weight: 500; color: #B03A28; }
  .pay { margin-top: 4px; font-size: 10px; color: #8A7E62; text-align: right; }
  .ship { margin-top: 18px; font-size: 10.5px; line-height: 1.9; color: #4A4334; }
  .ship b { font-weight: 600; }
  .confirm { margin-top: 20px; width: 100%; background: #1C1913; color: #F4EBD6; border: 0; padding: 15px 0;
    font: 500 13px/1 inherit; letter-spacing: .3em; cursor: pointer; }
  .confirm:hover { background: #3A3324; }
  .shipbar { display: flex; justify-content: space-between; margin-top: 22px; padding-top: 12px;
    border-top: 1px solid rgba(28,25,19,.14); position: relative; }
  .shipbar div { flex: 1; }
  .shipbar div:nth-child(2) { text-align: center; }
  .shipbar div:nth-child(3) { text-align: right; }
  .shipbar b { display: block; font-size: 12px; font-weight: 600; letter-spacing: .04em; }
  .shipbar span { font-size: 9.5px; color: #8A7E62; letter-spacing: .12em; }
  .fine { margin-top: 12px; font-size: 9px; color: #9A8E72; line-height: 1.8; }

  /* ---------- tab ---------- */
  .tabbar { position: absolute; left: 0; right: 0; bottom: 34px; height: 56px; display: flex; align-items: center; justify-content: space-around;
    background: rgba(255,255,255,.96); border-top: 1px solid rgba(28,25,19,.10); }
  .tab { font-size: 9px; letter-spacing: .14em; color: #A2957A; cursor: pointer; padding: 4px 0; border-bottom: 1px solid transparent; }
  .tab.on { color: #1C1913; border-bottom-color: #1C1913; }

  /* ---------- 立项：需求录入 / AI 方案 / 评审 ---------- */
  .pblock { margin-top: 12px; }
  .pblock .lb { font-size: 9.5px; letter-spacing: .2em; color: #2B5C86; }
  .req { margin-top: 6px; }
  .req .row { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(28,25,19,.13); font-size: 11px; line-height: 1.55; }
  .req .row span { width: 56px; color: #8A7E62; flex: none; }
  .sol { display: flex; gap: 8px; margin-top: 10px; }
  .card2 { flex: 1; border: 1px solid rgba(28,25,19,.18); padding: 9px; position: relative; }
  .card2.rec { border-color: #2B5C86; box-shadow: inset 0 0 0 1px #2B5C86; }
  .card2 .t { font-size: 11px; font-weight: 600; }
  .card2 .d { font-size: 9px; color: #4A4334; line-height: 1.65; margin-top: 4px; }
  .card2 .pm { font-size: 8.5px; margin-top: 5px; color: #2B5C86; }
  .card2 .tag { position: absolute; right: 7px; top: -7px; background: #2B5C86; color: #fff; font-size: 7.5px; padding: 2px 5px; letter-spacing: .1em; }
  .review { display: flex; gap: 10px; margin-top: 6px; }
  .review div { flex: 1; }
  .review b { font-family: "Noto Serif SC", serif; font-size: 17px; color: #1C1913; display: block; }
  .review span { font-size: 8.5px; color: #8A7E62; letter-spacing: .1em; }

  /* ---------- 团队：组织架构 ---------- */
  .org { padding: 16px 20px 0; }
  .org .root { width: 118px; margin: 6px auto 0; text-align: center; border: 1px solid #1C1913; padding: 6px 0; font-size: 11px; }
  .org .root em { display: block; font-style: normal; font-size: 8px; color: #8A7E62; margin-top: 2px; }
  .org .stem { width: 1px; height: 14px; background: #1C1913; margin: 0 auto; opacity: .45; }
  .org .bar { height: 1px; background: #1C1913; opacity: .45; margin: 0 46px; }
  .org .cols { display: flex; gap: 12px; }
  .org .col { flex: 1; position: relative; padding-top: 12px; }
  .org .col::before { content: ""; position: absolute; top: 0; left: 50%; width: 1px; height: 12px; background: #1C1913; opacity: .45; }
  .org .gl { text-align: center; font-size: 9px; letter-spacing: .14em; color: #2B5C86; margin-bottom: 7px; }
  .org .node { display: flex; align-items: center; gap: 6px; border: 1px solid rgba(28,25,19,.22); padding: 5px 6px; margin-bottom: 6px; cursor: pointer; background: #fff; }
  .org .node:hover { border-color: #1C1913; background: #FBFBF9; }
  .org .node.ai { border-style: dashed; }
  .org .node .av { width: 22px; height: 22px; border-radius: 50%; background: #1C1913; color: #fff; font-size: 9px; display: flex; align-items: center; justify-content: center; flex: none; }
  .org .node.ai .av { background: #2B5C86; }
  .org .node .nm { font-size: 10.5px; line-height: 1.25; }
  .org .node .nm i { font-style: normal; font-size: 7.5px; color: #8A7E62; display: block; }

  /* ---------- 个人详情 ---------- */
  .sheet { position: absolute; left: 0; right: 0; bottom: 34px; height: 56%; z-index: 40; display: none; background: #FFFFFF; padding: 18px 20px 0; border-radius: 18px 18px 0 0; box-shadow: 0 -10px 30px rgba(28,25,19,.14); }
  .sheet.on { display: block; }
  .sheet .hd { display: flex; align-items: center; gap: 10px; }
  .sheet .hd .av { width: 40px; height: 40px; border-radius: 50%; background: #1C1913; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .sheet .hd b { font-size: 15px; display: block; }
  .sheet .hd i { font-style: normal; font-size: 9.5px; color: #8A7E62; }
  .sheet .x { margin-left: auto; border: 0; background: none; font-size: 19px; cursor: pointer; color: #1C1913; line-height: 1; }
  .sheet .ds { margin-top: 12px; font-size: 10.5px; line-height: 1.8; color: #4A4334; }
  .skills { margin-top: 14px; }
  .skills .s { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: 9.5px; }
  .skills .s span:first-child { width: 50px; color: #8A7E62; flex: none; }
  .skills .track { flex: 1; height: 4px; background: rgba(28,25,19,.12); }
  .skills .track i { display: block; height: 100%; background: #2B5C86; }
  .skills .s b { width: 22px; text-align: right; font-weight: 500; color: #2B5C86; }
  .sheet .ft { margin-top: 16px; font-size: 9.5px; color: #8A7E62; }

  /* ---------- 下单：商家 ---------- */
  .item2 { padding: 8px 0 6px; border-bottom: 1px solid rgba(28,25,19,.12); }
  .item2 .t { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; }
  .item2 .t b { font-weight: 600; }
  .item2 .t span { color: #B03A28; font-variant-numeric: tabular-nums; }
  .shops { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
  .shop { border: 1px solid rgba(28,25,19,.2); padding: 3px 6px; font-size: 8.5px; color: #4A4334; cursor: pointer; background: #fff; line-height: 1.45; }
  .shop.on { border-color: #B03A28; color: #B03A28; box-shadow: inset 0 0 0 1px #B03A28; }
  .shop i { font-style: normal; display: block; font-size: 7.5px; color: #8A7E62; }
  .rev2 { margin-top: 10px; border-top: 1px solid rgba(28,25,19,.12); padding-top: 6px; }
  .rev2 div { display: flex; gap: 8px; font-size: 10px; line-height: 1.6; color: #4A4334; padding: 4px 0; }
  .rev2 span { width: 26px; flex: none; color: #2B5C86; }
  .org .summary { display: flex; margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(28,25,19,.14); }

<script>
  /* --- 撕纸 --- */
  function rnd(seed) { let s = seed >>> 0; return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  function tornPolygon(el, seed, amp) {
    const w = el.clientWidth || el.offsetWidth, h = el.clientHeight || el.offsetHeight;
    if (!w || !h) return 'none';
    const r = rnd(seed), j = () => (r() * 2 - 1) * amp, step = 13, pts = [];
    for (let x = 0; x <= w; x += step) pts.push(`${x.toFixed(1)}px ${Math.abs(j()).toFixed(1)}px`);
    for (let y = 0; y <= h; y += step) pts.push(`${(w - Math.abs(j())).toFixed(1)}px ${y.toFixed(1)}px`);
    for (let x = w; x >= 0; x -= step) pts.push(`${x.toFixed(1)}px ${(h - Math.abs(j())).toFixed(1)}px`);
    for (let y = h; y >= 0; y -= step) pts.push(`${Math.abs(j()).toFixed(1)}px ${y.toFixed(1)}px`);
    return 'polygon(' + pts.join(',') + ')';
  }
  function tearAll(root) {
    root.querySelectorAll('.tear[data-seed]').forEach((el) => {
      const poly = tornPolygon(el, Number(el.dataset.seed), 7);
      el.style.setProperty('--tear', poly);
      el.parentElement.style.setProperty('--tear', poly);
    });
  }
  tearAll(document);

  /* --- 封面：现实路口 + 速写人物 --- */
  function buildRoad(host) {
    const W = 517, H = 330;
    const vx = 172, vw = 173;      // 竖向车道
    const hy = 78, hh = 174;       // 横向车道
    const ink = '#171410';
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">`;
    s += `<defs>
      <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="6" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="asphalt" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="2" result="t"/>
        <feColorMatrix in="t" type="saturate" values="0"/>
        <feComposite operator="in" in2="SourceGraphic"/>
      </filter>
    </defs>`;

    // 人行道底色
    s += `<rect x="0" y="0" width="${W}" height="${H}" fill="#D8D0BE"/>`;
    s += `<rect x="0" y="0" width="${W}" height="${hy - 8}" fill="#DCD5C4"/>`;
    s += `<rect x="0" y="${hy + hh + 8}" width="${W}" height="${H - hy - hh - 8}" fill="#DCD5C4"/>`;
    s += `<rect x="0" y="0" width="${vx - 8}" height="${H}" fill="#DCD5C4"/>`;
    s += `<rect x="${vx + vw + 8}" y="0" width="${W - vx - vw - 8}" height="${H}" fill="#DCD5C4"/>`;

    // 沥青
    s += `<rect x="${vx - 8}" y="0" width="${vw + 16}" height="${H}" fill="#78756C" opacity=".90"/>`;
    s += `<rect x="0" y="${hy - 8}" width="${W}" height="${hh + 16}" fill="#78756C" opacity=".90"/>`;
    s += `<rect x="${vx - 8}" y="${hy - 8}" width="${vw + 16}" height="${hh + 16}" fill="#737067" opacity=".90"/>`;
    s += `<rect x="${vx - 8}" y="0" width="${vw + 16}" height="${H}" fill="#000" opacity=".05" filter="url(#asphalt)"/>`;
    s += `<rect x="0" y="${hy - 8}" width="${W}" height="${hh + 16}" fill="#000" opacity=".05" filter="url(#asphalt)"/>`;

    // 路缘
    s += `<rect x="${vx - 10}" y="0" width="2" height="${hy - 10}" fill="#B9B1A0"/>`;
    s += `<rect x="${vx + vw + 9}" y="0" width="2" height="${hy - 10}" fill="#B9B1A0"/>`;
    s += `<rect x="${vx - 10}" y="${hy + hh + 9}" width="2" height="${H}" fill="#B9B1A0"/>`;
    s += `<rect x="${vx + vw + 9}" y="${hy + hh + 9}" width="2" height="${H}" fill="#B9B1A0"/>`;

    // —— 交错叠加：另外两层路口，各自旋转，压在主路口下面 ——
    const cx0 = vx + vw / 2, cy0 = hy + hh / 2;
    const ghost = (angle, op) => `<g transform="rotate(${angle} ${cx0} ${cy0})" opacity="${op}">
        <rect x="${vx - 8}" y="-40" width="${vw + 16}" height="${H + 80}" fill="#6F6C63"/>
        <rect x="-40" y="${hy - 8}" width="${W + 80}" height="${hh + 16}" fill="#6F6C63"/>
        <rect x="${vx - 10}" y="-40" width="2" height="${hy + 30}" fill="#BDB5A3"/>
        <rect x="${vx + vw + 9}" y="-40" width="2" height="${hy + 30}" fill="#BDB5A3"/>
        <rect x="-40" y="${cy0 - 1}" width="${W + 80}" height="2" fill="#E8E2D2" opacity=".5"/>
        <rect x="${cx0 - 1}" y="-40" width="2" height="${H + 80}" fill="#E8E2D2" opacity=".5"/>
      </g>`;
    s += ghost(-18, .18) + ghost(14, .13) + ghost(31, .09);

    // 车道分隔虚线
    const cx = vx + vw / 2, cy = hy + hh / 2;
    for (let y = 0; y < hy - 26; y += 26) s += `<rect x="${cx - 1}" y="${y}" width="2" height="14" fill="#E8E2D2" opacity=".8"/>`;
    for (let y = hy + hh + 20; y < H; y += 26) s += `<rect x="${cx - 1}" y="${y}" width="2" height="14" fill="#E8E2D2" opacity=".8"/>`;
    for (let x = 0; x < vx - 26; x += 26) s += `<rect x="${x}" y="${cy - 1}" width="14" height="2" fill="#E8E2D2" opacity=".8"/>`;
    for (let x = vx + vw + 20; x < W; x += 26) s += `<rect x="${x}" y="${cy - 1}" width="14" height="2" fill="#E8E2D2" opacity=".8"/>`;

    // 斑马线（四条）
    const zw = 10, zg = 9;
    for (let x = vx - 2; x < vx + vw + 2; x += zw + zg) {
      s += `<rect x="${x}" y="${hy - 62}" width="${zw}" height="34" fill="#EFE9DA" opacity=".92"/>`;   // 上
      s += `<rect x="${x}" y="${hy + hh + 28}" width="${zw}" height="34" fill="#EFE9DA" opacity=".92"/>`; // 下
    }
    for (let y = hy; y < hy + hh; y += zw + zg) {
      s += `<rect x="${vx - 62}" y="${y}" width="34" height="${zw}" fill="#EFE9DA" opacity=".92"/>`;      // 左
      s += `<rect x="${vx + vw + 28}" y="${y}" width="34" height="${zw}" fill="#EFE9DA" opacity=".92"/>`;  // 右
    }
    // 停止线
    s += `<rect x="${vx - 2}" y="${hy - 72}" width="${vw + 4}" height="4" fill="#EFE9DA" opacity=".9"/>`;
    s += `<rect x="${vx - 2}" y="${hy + hh + 68}" width="${vw + 4}" height="4" fill="#EFE9DA" opacity=".9"/>`;
    s += `<rect x="${vx - 72}" y="${hy}" width="4" height="${hh}" fill="#EFE9DA" opacity=".9"/>`;
    s += `<rect x="${vx + vw + 68}" y="${hy}" width="4" height="${hh}" fill="#EFE9DA" opacity=".9"/>`;

    // 井盖与磨损
    s += `<circle cx="${vx + 30}" cy="${hy + hh + 46}" r="9" fill="#5E5B54" stroke="#4E4B45" stroke-width="1"/>`;
    s += `<circle cx="${vx + vw + 52}" cy="${hy - 34}" r="7" fill="#5E5B54" stroke="#4E4B45" stroke-width="1"/>`;

    // —— 速写人物（实心，笔触）——
    const figure = (x, y, sc, rot, flip) => `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${flip ? -1 : 1} ${1}) scale(${sc})" filter="url(#rough)" stroke="${ink}" stroke-linecap="round" fill="none">

  async function callJSON(system, user, temp) {
    const endpoint = store.get('dipian.endpoint');
    const model = store.get('dipian.model') || 'deepseek-chat';
    const t = typeof temp === 'number' ? temp : 0.6;

    // 首选：走自己的 BFF（Key 在服务端，前端拿不到）
    if (endpoint) {
      const r = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ system, user, model, temperature: t }),
      });
      let j = null;
      try { j = await r.json(); } catch (e) { j = null; }
      if (!r.ok) {
        const msg = (j && j.error && j.error.message) || ('HTTP ' + r.status);
        throw new Error(msg);
      }
      if (!j || !j.data || typeof j.data !== 'object') throw new Error('BFF 返回格式不对。');
      return { data: j.data, usage: j.usage || null, model: j.model || model };
    }

    // 回退：直连（仅演示，Key 在浏览器本地）
    const key = store.get('dipian.apiKey');
    const body = {
      model,
      temperature: t,
      response_format: { type: 'json_object' },
      messages: [
        { role: 'system', content: system },
        { role: 'user', content: user },
      ],
    };
    const r = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key },
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      let detail = '';
      try { detail = (await r.text()).slice(0, 140); } catch (e) { detail = ''; }
      throw new Error('HTTP ' + r.status + (detail ? ' · ' + detail : ''));
    }
    const j = await r.json();
    const txt = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
    let data;
    try { data = JSON.parse(txt); } catch (e) { throw new Error('返回不是合法 JSON：' + txt.slice(0, 100)); }
    return { data, usage: j.usage, model };
  }

            saved[y] = (saved[y] || []).concat([v]);
            store.set('dipian.logs', JSON.stringify(saved));
            if (YEARS[y]) YEARS[y].logs.push(v);
          } catch (err) { /* 存不了就只在本次会话里 */ }
        };
        ys.querySelector('.ygo').onclick = (ev) => { ev.stopPropagation(); ys.classList.remove('on'); show('project'); };
    };

    phone.querySelectorAll('.cell[data-year]').forEach((c) => {
      c.addEventListener('click', (e) => {
        e.stopPropagation();
        const im = c.querySelector('.ph img');
        openYear(c.dataset.year, im ? im.src : null);
      });
    });

    const addYearBtn = phone.querySelector('.addyear');
    if (addYearBtn) {
      addYearBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openYear(createNextYear(), null);
      });
    }

    /* ---------- AI 读底片 ---------- */
    const aiBtn = phone.querySelector('.aibtn');
    const aiState = phone.querySelector('.aistate');
    const syncAI = () => {
      if (!aiState) return;
      const ep = store.get('dipian.endpoint');
      const k = store.get('dipian.apiKey');
      if (ep) {
        let host = ep;
        try { host = new URL(ep).host; } catch (e) { host = ep.slice(0, 22); }
        aiState.textContent = 'BFF · ' + host;
        aiState.classList.add('on');
      } else if (k) {
        aiState.textContent = '直连 · ' + (store.get('dipian.model') || 'deepseek-chat');
        aiState.classList.add('on');
      } else {
        aiState.textContent = '未连接 · 点这里设置';
        aiState.classList.remove('on');
      }
    };
    const closeAI = () => aisheet.classList.remove('on');
    const bindX = () => { const x = aisheet.querySelector('.x'); if (x) x.onclick = (e) => { e.stopPropagation(); closeAI(); }; };

    const renderDemo = () => {
      aisheet.innerHTML = `<div class="ai-hd"><b style="font-size: 15px;">AI 读完了十一年</b><button class="x">×</button></div>
        <div class="ai-lab">你擅长的</div>
        <div class="ai-big">把混乱收进秩序</div>
        <div><div class="ai-ev"><div>2021 · 用 42 个组件把混乱的界面收进秩序</div><div>2024 · 砍掉三个功能，留存 11% → 19%</div><div>2026 · 十周一个人上线，7 个真实用户</div></div></div>
        <div class="ai-lab">可以打开的</div>
        <div class="ai-big">用 AI 做决策，不做设计稿</div>
        <div class="ai-meta">演示结果 · 未调用 API</div>
        <div class="ai-actions"><button class="again">配置 Key 重新读</button></div>`;
      bindX();
      aisheet.querySelector('.again').onclick = (e) => { e.stopPropagation(); openKey(); };
      aisheet.classList.add('on');
    };

    const renderResult = ({ data, usage, model }) => {
      const ev = Array.isArray(data.evidence) ? data.evidence : [];
      aisheet.innerHTML = `<div class="ai-hd"><b style="font-size: 15px;">AI 读完了十一年</b><button class="x">×</button></div>
        <div class="ai-lab">你擅长的</div>
        <div class="ai-big">${data.strength || '—'}</div>
        <div class="ai-ev">${ev.map((e) => `<div>${e}</div>`).join('')}</div>
        <div class="ai-lab">可以打开的</div>
        <div class="ai-big">${data.openings || '—'}</div>
        <div class="ai-meta">${model} · 输入 ${(usage && usage.prompt_tokens) || '-'} / 输出 ${(usage && usage.completion_tokens) || '-'} tokens · ${data.why || ''}</div>
        <div class="ai-actions"><button class="again">再读一次</button><button class="toinv">带着结论去立项 →</button></div>`;
      bindX();
      aisheet.querySelector('.again').onclick = (e) => { e.stopPropagation(); runAI(); };
      aisheet.querySelector('.toinv').onclick = (e) => {
        e.stopPropagation();
        store.set('dipian.conclusion', JSON.stringify({ strength: data.strength || '', openings: data.openings || '' }));
        closeAI();
        show('project');
        syncFromFilmAll(true);
      };
      aisheet.classList.add('on');
    };

    const renderError = (msg) => {
      aisheet.innerHTML = `<div class="ai-hd"><b style="font-size: 15px;">AI 没读成</b><button class="x">×</button></div>
        <div class="ai-err">${msg}</div>
        <div class="ai-actions"><button class="retry">重试</button><button class="demo">先用演示结果</button><button class="cfg">改 Key</button></div>`;
      bindX();
      aisheet.querySelector('.retry').onclick = (e) => { e.stopPropagation(); runAI(); };
      aisheet.querySelector('.demo').onclick = (e) => { e.stopPropagation(); renderDemo(); };
      aisheet.querySelector('.cfg').onclick = (e) => { e.stopPropagation(); openKey(); };
      aisheet.classList.add('on');
    };

    const runAI = async () => {
      aisheet.innerHTML = `<div class="ai-hd"><b style="font-size: 15px;">读底片</b><button class="x">×</button></div>
        <div class="ai-lab">你擅长的</div>
        <div class="skel skel-b" style="width: 70%;"></div>
        <div class="skel skel-l"></div>
        <div class="skel skel-l" style="width: 84%;"></div>
        <div class="skel skel-l" style="width: 60%;"></div>
        <div class="ai-lab" style="margin-top: 22px;">可以打开的</div>
        <div class="skel skel-b" style="width: 56%;"></div>
        <div class="ai-meta">正在读十一年的记录…</div>`;
      bindX();
      aisheet.classList.add('on');
      try {
        const res = await callAI();
        renderResult(res);
      } catch (err) {
        renderError(String(err && err.message ? err.message : err));
      }
    };

    const openKey = () => {
      aisheet.innerHTML = `<div class="ai-hd"><b style="font-size: 15px;">AI 连接设置</b><button class="x">×</button></div>
        <div class="ai-meta" style="margin-top: 10px;">推荐填服务地址（BFF）：Key 只在服务端，浏览器拿不到。留空则退回直连模式，Key 存在本机 localStorage，仅适合自己试。</div>
        <div class="ai-lab" style="margin-top: 14px;">服务地址</div>
        <input class="kinput ept" type="text" placeholder="http://localhost:8787/api/chat">
        <div class="ai-lab">直连 Key（可选）</div>
        <input class="kinput key" type="password" placeholder="sk-...">
        <select class="ksel"><option value="deepseek-chat">deepseek-chat</option><option value="deepseek-reasoner">deepseek-reasoner</option></select>
        <div class="ai-actions"><button class="ksave">保存</button><button class="kclear">清除</button></div>`;
      bindX();
      const epInput = aisheet.querySelector('.ept');
      const keyInput = aisheet.querySelector('.key');
      const sel = aisheet.querySelector('.ksel');
      epInput.value = store.get('dipian.endpoint') || '';
      keyInput.value = store.get('dipian.apiKey') || '';
      sel.value = store.get('dipian.model') || 'deepseek-chat';
      aisheet.querySelector('.ksave').onclick = (e) => {
        e.stopPropagation();
        const ep = epInput.value.trim();
        const kk = keyInput.value.trim();
        if (ep) store.set('dipian.endpoint', ep); else store.del('dipian.endpoint');
        if (kk) store.set('dipian.apiKey', kk); else store.del('dipian.apiKey');
        store.set('dipian.model', sel.value);
        syncAI();
        closeAI();
      };
      aisheet.querySelector('.kclear').onclick = (e) => {
        e.stopPropagation();
        store.del('dipian.endpoint');
        store.del('dipian.apiKey');
        syncAI();
        closeAI();
      };
      aisheet.classList.add('on');
    };

    if (aiBtn) {
      aiBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!store.get('dipian.endpoint') && !store.get('dipian.apiKey')) { openKey(); return; }
        runAI();
      });
      aiState.addEventListener('click', (e) => { e.stopPropagation(); openKey(); });
      syncAI();
    }

    /* ---------- 立项：可编辑需求 + AI 生成方案与评审 ---------- */
    const fillBtn = phone.querySelector('[data-fill]');
    if (fillBtn) {
      fillBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        let c = null;
        try { c = JSON.parse(store.get('dipian.conclusion') || 'null'); } catch (err) { c = null; }
        if (!c || !c.openings) return;
        const what = phone.querySelector('.rq[data-k="what"]');
        if (what) {
          what.value = c.openings;
          const cur = {};
          rqInputs.forEach((i) => { cur[i.dataset.k] = i.value; });
          store.set('dipian.req', JSON.stringify(cur));
          what.focus();
        }
      });
    }

    syncFromFilmAll();
    syncMeOrder();

    const REQ_DEFAULT = {
      what: '把手机里的旅行照，自动排成一本能打印的小册子',
      who: '一年旅行 ≥3 次、懒得修图的人',
      when: '10 周内看到第一个能寄出去的版本',
    };
    const rqInputs = phone.querySelectorAll('.rq');
    let savedReq = {};
    try { savedReq = JSON.parse(store.get('dipian.req') || '{}'); } catch (e) { savedReq = {}; }
    rqInputs.forEach((inp) => {
      const k = inp.dataset.k;
      inp.value = savedReq[k] || REQ_DEFAULT[k] || '';
      inp.placeholder = REQ_DEFAULT[k] || '';
      inp.addEventListener('change', () => {
        const cur = {};
        rqInputs.forEach((i) => { cur[i.dataset.k] = i.value; });
        store.set('dipian.req', JSON.stringify(cur));
      });
    });

    const genBtn = phone.querySelector('.genbtn');
    const solEl = phone.querySelector('[data-sol]');
    const revEl = phone.querySelector('[data-rev]');
    const verdictEl = phone.querySelector('[data-verdict]');
    const rev2El = phone.querySelector('[data-rev2]');
    const gmsg = phone.querySelector('[data-gmsg]');

    const renderProject = (d) => {
      const plans = Array.isArray(d.plans) ? d.plans.slice(0, 2) : [];
      if (plans.length === 2 && solEl) {
        solEl.innerHTML = plans.map((p, i) => {
          const rec = i === Number(d.recommended);
          return `<div class="card2 ${rec ? 'rec' : ''}">${rec ? '<div class="tag">推荐</div>' : ''}`
            + `<div class="t">${i === 0 ? 'A ' : 'B '}${p.name || ''}</div>`
            + `<div class="d">${p.desc || ''}</div>`
            + `<div class="pm">${[p.pros, p.cons].filter(Boolean).join(' · ')}</div></div>`;
        }).join('');
      }
      const r = d.review || {};
      const n = (v) => (typeof v === 'number' && isFinite(v) ? v.toFixed(1) : '—');
      if (revEl) {
        revEl.innerHTML = `<div><b>${n(r.concept)}</b><span>概念</span></div>`
          + `<div><b>${n(r.cost)}</b><span>成本</span></div>`
          + `<div><b class="risk">${n(r.risk)}</b><span>风险</span></div>`;
      }
      if (d.verdict && verdictEl) verdictEl.textContent = '结论：' + d.verdict;
      const rows = [['保留', d.keep], ['要改', d.fix], ['风险', d.risky]].filter((x) => x[1]);
      if (rows.length && rev2El) {
        rev2El.innerHTML = rows.map(([k, v]) => `<div><span>${k}</span>${v}</div>`).join('');
      }
    };

    if (genBtn) {
      genBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!store.get('dipian.endpoint') && !store.get('dipian.apiKey')) {
          gmsg.textContent = '先在底片页配置服务地址或 Key，再回来生成。';
          return;
        }
        const reqData = {};
        rqInputs.forEach((i) => { reqData[i.dataset.k] = i.value.trim(); });
        store.set('dipian.req', JSON.stringify(reqData));
        genBtn.disabled = true;
        const oldLabel = genBtn.textContent;
        genBtn.textContent = '生成中…';
        gmsg.textContent = '';
        try {
          const { data } = await callProject(reqData, filmSummary());
          renderProject(data);
          gmsg.textContent = '';
        } catch (err) {
          gmsg.textContent = '生成失败：' + String(err && err.message ? err.message : err);
        } finally {
          genBtn.disabled = false;
          genBtn.textContent = oldLabel;
        }
      });
    }

    phone.querySelectorAll('[data-go]').forEach((el) => {
      el.addEventListener('click', (e) => { e.stopPropagation(); show(el.dataset.go); });
    });

    /* ---------- 下单后的物流追踪 ---------- */
    const orderScr = phone.querySelector('.scr[data-name="order"]');
    if (orderScr) {
      const orderBox = orderScr.querySelector('.order');
      const trackBox = orderScr.querySelector('[data-track]');
      const confirmBtn = orderScr.querySelector('.confirm');
      const TNO = 'SF1234567890';
      const NODES = [
        ['已下单', '11 / 20 10:12'],
        ['已发货 · 顺丰速运', '11 / 20 18:40'],
        ['运输中 · 已到达上海转运中心', '11 / 21 07:05'],
        ['派送中', '11 / 21 13:40'],
        ['已签收', '11 / 21 14:12'],
      ];
      const readOrder = () => {
        try { return JSON.parse(store.get('dipian.order') || 'null'); } catch (e) { return null; }
      };
      const STATUS = ['已下单', '已发货', '运输中', '派送中', '已签收'];
      const renderTrack = () => {
        if (!trackBox) return;
        const o = readOrder();
        if (!o) return;
        const stage = Math.min(o.stage || 0, NODES.length - 1);
        const done = stage >= NODES.length - 1;
        trackBox.innerHTML = `<div class="theader">
            <div class="tstatus"><b>${STATUS[stage]}</b></div>
            <span class="stamp">${done ? '已到货' : '已冲洗'}</span>
          </div>
          <span class="tno">${TNO} · 顺丰速运</span>
          <div class="tl">${NODES.map(([t, s], i) => {
            const k = i < stage ? 'done' : (i === stage ? 'on' : 'wait');
            return `<div class="n ${k}"><b>${t}</b><span>${s}</span></div>`;
          }).join('')}</div>
          <div class="tact">
            <button class="copy">复制单号</button>
            ${done ? '<button class="back">去「我」</button>' : '<button class="next">推进到下一节点</button>'}
          </div>
          <div class="tnote">${done
            ? '已签收，订单记为「已到货」，保修与发票在「我」里。'
            : '演示用：点「推进到下一节点」可以让物流往前走一步；签收后自动回到「我」页。'}</div>`;
        const copyBtn = trackBox.querySelector('.copy');
        copyBtn.onclick = async (e) => {
          e.stopPropagation();
          try {
            await navigator.clipboard.writeText(TNO);
            copyBtn.textContent = '已复制';
          } catch (err) { copyBtn.textContent = TNO; }
        };
        const backBtn = trackBox.querySelector('.back');
        if (backBtn) backBtn.onclick = (e) => { e.stopPropagation(); show('me'); syncMeOrder(); };
        const nextBtn = trackBox.querySelector('.next');
        if (nextBtn) {
          nextBtn.onclick = (e) => {
            e.stopPropagation();
            const cur = readOrder();
            if (!cur) return;
            const ns = Math.min((cur.stage || 0) + 1, NODES.length - 1);
            store.set('dipian.order', JSON.stringify({ ...cur, stage: ns }));
            const h1n = orderScr.querySelector('.h1');
            if (h1n) h1n.textContent = ns >= NODES.length - 1 ? '已签收，冲洗完了。' : '已下单，正在路上。';
            renderTrack();
            syncMeOrder();
            if (ns >= NODES.length - 1) {
              // 签收：停一下让人看到最后一个节点亮起，再自动切到「我」
              setTimeout(() => { show('me'); syncMeOrder(); }, 1400);
            }
          };
        }
      };
      const applyOrderState = () => {
        const h1 = orderScr.querySelector('.h1');
        const o = readOrder();
        if (o) {
          orderBox.classList.add('tracked');
          if (h1) h1.textContent = (o.stage || 0) >= NODES.length - 1 ? '已签收，冲洗完了。' : '已下单，正在路上。';
          renderTrack();
        } else {
          orderBox.classList.remove('tracked');
          if (h1) h1.textContent = '三件硬件，六家商家。';
        }
      };
      if (confirmBtn) {
        confirmBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          store.set('dipian.order', JSON.stringify({ no: TNO, carrier: '顺丰速运', at: Date.now(), stage: 2 }));
          applyOrderState();
          syncMeOrder();
        });
      }
      applyOrderState();
    }

    show(cfg.initial);

    // 团队成员详情
    phone.querySelectorAll('[data-mem]').forEach((n) => {
      n.addEventListener('click', (e) => {
        e.stopPropagation();
        const m = TEAM[n.dataset.mem];
        if (!m) return;
        const face = m.ai
          ? `<svg viewBox="0 0 64 64"><rect width="64" height="64" fill="#2B5C86"/><circle cx="32" cy="32" r="14" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="32" cy="32" r="4" fill="#fff"/><path d="M32 8v10M32 46v10M8 32h10M46 32h10" stroke="#fff" stroke-width="1.2" opacity=".65"/></svg>`
          : `<svg viewBox="0 0 64 64"><rect width="64" height="64" fill="#1B1711"/><circle cx="32" cy="24" r="11" fill="#EFE8D8"/><path d="M11 64c0-12 9-19 21-19s21 7 21 19z" fill="#EFE8D8"/></svg>`;
        sheet.innerHTML = `<div class="pf">
            <div class="pf-img">${face}</div>
            <div class="pf-t"><b>${m.name}</b><i>${m.role}</i><div class="pm">${m.foot}</div></div>
            <button class="x">×</button>
          </div>
          <div class="ds">${m.desc}</div>
          <div class="skills">${m.skills.map(([k, v]) => `<div class="s"><span>${k}</span><div class="track"><i style="width:${v}%"></i></div><b>${v}</b></div>`).join('')}</div>
          <div class="fl">个人底片</div>
          <div class="strip">${m.film.map(([y, l]) => `<div class="mf ${m.ai ? 'ai' : ''}"><b>${y}</b><span>${l}</span></div>`).join('')}</div>
          <div class="tags"><span>远程协作</span><span>按周</span><span>两周一次评审</span></div>`;
        sheet.classList.add('on');
        sheet.querySelector('.x').addEventListener('click', (ev) => { ev.stopPropagation(); sheet.classList.remove('on'); });
      });
    });

    // 商家比价
    const sumEl = phone.querySelector('.sum2');
    const recalc = () => {
      let total = 0;
      phone.querySelectorAll('.item2').forEach((it) => {
        const p = it.querySelector('.shop.on');
        if (p) total += Number(p.dataset.price);
      });
      if (sumEl) sumEl.textContent = '¥' + total.toLocaleString('en-US');
    };
    phone.querySelectorAll('.item2').forEach((it) => {
      it.querySelectorAll('.shop').forEach((sh) => {
        sh.addEventListener('click', (e) => {
          e.stopPropagation();
          it.querySelectorAll('.shop').forEach((x) => x.classList.remove('on'));
          sh.classList.add('on');
          const priceEl = it.querySelector('.price');
          if (priceEl) priceEl.textContent = '¥' + Number(sh.dataset.price).toLocaleString('en-US');
          recalc();
        });
      });
    });
    recalc();

    // 投资认购
    let amt = 5;
    const invBtn = phone.querySelector('.invbtn');
    const cks = phone.querySelectorAll('.ck');
    cks.forEach((c) => c.addEventListener('click', (e) => {
      e.stopPropagation();
      c.classList.toggle('on');
      const ok = [...cks].every((x) => x.classList.contains('on'));
      if (invBtn) {
        invBtn.disabled = !ok;
        invBtn.classList.toggle('off', !ok);
      }
    }));
    if (invBtn) {
      invBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        isheet.innerHTML = `<div class="hd"><div><b>参与投资</b><i style="font-style: normal; font-size: 9.5px; color: #8A7E62;">天使轮 · 投前估值 ¥450 万</i></div><button class="x">×</button></div>
          <div class="iamt"><div data-amt="3">¥3 万</div><div data-amt="5" class="on">¥5 万</div><div data-amt="10">¥10 万</div></div>
          <div class="inote">团队跟投上限 5 万；外部投资人需做合格投资者认证，10 万起投。认购后 6 个月锁定期，3 年内可按 1.5 倍回购。</div>
          <button class="invbtn" style="margin-top: 18px;">确认认购 <span class="sel">¥5 万</span></button>`;
        isheet.classList.add('on');
        isheet.querySelector('.x').addEventListener('click', (ev) => { ev.stopPropagation(); isheet.classList.remove('on'); });
        isheet.querySelectorAll('.iamt div').forEach((d) => {
          d.addEventListener('click', () => {
            isheet.querySelectorAll('.iamt div').forEach((x) => x.classList.remove('on'));
            d.classList.add('on');
            amt = Number(d.dataset.amt);
            isheet.querySelector('.invbtn .sel').textContent = '¥' + amt + ' 万';
          });
        });
        isheet.querySelector('.invbtn').addEventListener('click', (ev) => {
          ev.stopPropagation();
          const list = phone.querySelector('.plist');
          if (list) {
            const row = document.createElement('div');
            row.className = 'pl';
            row.innerHTML = `<span class="who">你<i>团队跟投</i></span><span class="mo">¥${amt} 万</span><em>待签约</em>`;
            list.appendChild(row);
          }
          const now = 32 + amt;
          const pct = Math.min(100, Math.round(now / 50 * 100));
          const amtEl = phone.querySelector('.amt');
          const pctEl = phone.querySelector('.pct');
          const barEl = phone.querySelector('.prog .track i');
          if (amtEl) amtEl.textContent = '¥' + now + ' 万';
          if (pctEl) pctEl.textContent = pct + '%';
          if (barEl) barEl.style.width = pct + '%';
          const h1 = phone.querySelector('.inv .h1');
          if (h1) h1.innerHTML = '天使轮 50 万，<br>还差 ' + Math.max(0, 50 - now) + ' 万。';
          isheet.classList.remove('on');
        });
      });
    }

    wrap.appendChild(phone);
    return wrap;
  }

  PHONES.forEach((cfg) => {
    stage.appendChild(buildPhone(cfg));
    const label = document.createElement('div');
    label.className = 'plabel';
    label.textContent = cfg.label;
    label.style.left = cfg.x + 'px';
    label.style.top = (cfg.y + 876 * SCALE + 12) + 'px';
    stage.appendChild(label);
  });

  document.querySelectorAll('#road').forEach(buildRoad);
  tearAll(document);

  /* 按窗口缩放整块版心：任何预览尺寸都能看到完整的六台手机 */
  function fitBoard() {
    const s = Math.min(window.innerWidth / 1800, window.innerHeight / 1000, 1);
    const b = document.getElementById('board');
    if (b) b.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fitBoard);
  fitBoard();

  /* ---------- 手机模式：一台手机 + 左右滑动 ---------- */
  const ORDER = ['cover', 'film', 'project', 'me'];
  let mphone = null;

  function fitMobile() {
    if (!mphone) return;
    const st = document.getElementById('mstage');
    const s = Math.min((window.innerWidth - 20) / 417, (window.innerHeight - 150) / 876);
    mphone.style.transform = 'scale(' + s + ')';
    st.style.width = (417 * s) + 'px';
    st.style.height = (876 * s) + 'px';
  }

  function syncPager() {
    if (!mphone) return;
    const on = mphone.querySelector('.scr.on');
    const i = on ? ORDER.indexOf(on.dataset.name) : 0;
    const step = document.getElementById('mstep');
    if (step) step.textContent = (i + 1) + ' / ' + ORDER.length;
    document.querySelectorAll('#mdots i').forEach((d, k) => d.classList.toggle('on', k === i));
  }

  function go(name) {
    if (!mphone) return;
    const tab = mphone.querySelector('.tab[data-tab="' + name + '"]');
    if (tab) tab.click();
    syncPager();
  }

  function buildMobile() {
    if (mphone) return;
    const host = document.getElementById('mstage');
    const wrap = buildPhone({ initial: 'cover', x: 0, y: 0 });
    wrap.style.left = '0';
    wrap.style.top = '0';
    host.appendChild(wrap);
    mphone = wrap;
    wrap.querySelectorAll('#road').forEach(buildRoad);
    tearAll(wrap);

    const dots = document.getElementById('mdots');
    ORDER.forEach(() => dots.appendChild(document.createElement('i')));

    host.addEventListener('click', () => setTimeout(syncPager, 30));

    let sx = 0, sy = 0;
    host.addEventListener('touchstart', (e) => {
      const t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    }, { passive: true });
    host.addEventListener('touchend', (e) => {
      const t = e.changedTouches[0];
      const dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
      const on = mphone.querySelector('.scr.on');
      const i = ORDER.indexOf(on.dataset.name);
      const next = dx < 0 ? Math.min(i + 1, ORDER.length - 1) : Math.max(i - 1, 0);
      if (next !== i) go(ORDER[next]);
    }, { passive: true });

    fitMobile();
    syncPager();
  }

    [/^已认购 ¥(\d+) 万$/, (m) => 'Pledged ¥' + Number(m[1]) * 10 + 'K'],
    [/^还差 (\d+) 万。$/, (m) => '¥' + Number(m[1]) * 10 + 'K to go.'],
    [/^已配置 · (.+)$/, (m) => 'Ready · ' + m[1]],
    [/^第 (\d+) 年$/, (m) => 'Year ' + m[1]],
    [/^结论：(.*)$/, (m) => 'Decision: ' + m[1]],
    [/^(\d+) 个月$/, (m) => m[1] + ' months'],
    [/^(\d+) 万$/, (m) => '¥' + Number(m[1]) * 10 + 'K'],
    [/^([\d.]+)万$/, (m) => '¥' + Math.round(parseFloat(m[1]) * 10) + 'K'],
  ];

  function ruleTranslate(s) {
    for (const [re, fn] of RULES) {
      const m = s.match(re);
      if (m) return fn(m);
    }
    return null;
  }

  let lang = store.get('dipian.lang') || 'zh';
  const origText = new WeakMap();
  const origAttr = new WeakMap();
  let translating = false;

  function translateText(root) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach((node) => {
      const parent = node.parentElement;
      if (!parent) return;
      const tag = parent.tagName;
      if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'TITLE') return;
      const raw = node.nodeValue;
      if (!raw || !raw.trim()) return;
      if (lang === 'en') {
        if (!origText.has(node)) origText.set(node, raw);
        const src = origText.get(node);
        const key = src.trim();
        if (!/[\u4e00-\u9fa5]/.test(key)) return;
        const tr = I18N[key] || ruleTranslate(key);
        if (tr) {
          const next = src.replace(key, tr);
          if (node.nodeValue !== next) node.nodeValue = next;
        }
      } else if (origText.has(node)) {
        const back = origText.get(node);
        if (node.nodeValue !== back) node.nodeValue = back;
      }
    });
  }

  function translateAttrs(root) {
    root.querySelectorAll('[placeholder], [title], [aria-label]').forEach((el) => {
      if (!origAttr.has(el)) {
        origAttr.set(el, {
          placeholder: el.getAttribute('placeholder'),
          title: el.getAttribute('title'),
          'aria-label': el.getAttribute('aria-label'),
        });
      }
      const o = origAttr.get(el);
      ['placeholder', 'title', 'aria-label'].forEach((name) => {
        const v = o[name];
        if (!v || !/[\u4e00-\u9fa5]/.test(v)) return;
        if (lang === 'en') {
          const tr = I18N[v] || ruleTranslate(v);
          if (tr && el.getAttribute(name) !== tr) el.setAttribute(name, tr);
        } else {
          el.setAttribute(name, v);
        }
      });
    });

    // 输入框的默认值也要跟着切（用户自己改过的不动）
    root.querySelectorAll('input').forEach((el) => {
      const rec = origAttr.get(el) || {};
      if (rec.value === undefined) {
        rec.value = el.value;
        origAttr.set(el, rec);
      }
      const orig = rec.value;
      if (!orig || !/[\u4e00-\u9fa5]/.test(orig)) return;
      const en = I18N[orig] || ruleTranslate(orig);
      if (!en) return;
      if (lang === 'en') {
        if (el.value === orig) el.value = en;
      } else if (el.value === en) {
        el.value = orig;
      }
    });
  }

  function translateAll() {
    if (translating) return;
    translating = true;
    try {
      document.querySelectorAll('#board, #mobile').forEach((root) => {
        translateText(root);
        translateAttrs(root);
      });
    } finally {
      translating = false;
    }
  }

  function syncLangUI() {
    document.querySelectorAll('[data-lang]').forEach((el) => {
      el.classList.toggle('on', el.dataset.lang === lang);
    });
    document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
  }

  function setLang(next) {
    lang = next === 'en' ? 'en' : 'zh';
    store.set('dipian.lang', lang);
    syncLangUI();
    translateAll();
  }

  window.addEventListener('load', () => {
    syncLangUI();
    translateAll();
    const mo = new MutationObserver(() => translateAll());
    mo.observe(document.body, { childList: true, subtree: true, characterData: true });
    document.addEventListener('click', (e) => {
      const el = e.target.closest && e.target.closest('[data-lang]');
      if (!el) return;
      e.preventDefault();
      e.stopPropagation();
      setLang(el.dataset.lang);
    }, true);
  });

  window.addEventListener('resize', fitMobile);
  buildMobile();
  fitMobile();
  syncPager();
</script>
</body>
</html>
