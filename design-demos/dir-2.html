<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>重开 · 方向二 几何</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #E2DAC8; }
  body {
    width: 1440px; height: 900px; overflow: hidden; position: relative;
    background: #EDE6D6; color: #1A1A18;
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  :root { --ink: #1A1A18; --paper: #EDE6D6; --red: #D8452F; --yel: #E8B62C; --blue: #4E6E96; }

  /* ---------- 板面 ---------- */
  .bd-shape { position: absolute; }
  .bd-red { left: -80px; top: 600px; width: 250px; height: 250px; background: var(--red); border-radius: 50%; }
  .bd-yel { left: 176px; top: 742px; width: 112px; height: 112px; background: var(--yel); }
  .bd-blue { left: 56px; top: 500px; width: 108px; height: 108px; background: var(--blue); border-radius: 0 108px 0 0; }
  .bd-bar { left: 28px; bottom: 62px; width: 26px; height: 84px; background: var(--ink); }
  .bd-bar.b2 { left: 64px; } .bd-bar.b3 { left: 100px; } .bd-bar.b4 { left: 136px; }

  .board-title { position: absolute; left: 76px; top: 56px; }
  .board-title h1 {
    font-family: "Noto Serif SC", "Songti SC", SimSun, serif; font-weight: 900; font-size: 68px;
    letter-spacing: .08em; line-height: 1.1;
  }
  .board-title .sub { margin-top: 18px; font-size: 10px; letter-spacing: .3em; color: #6B6558; }
  .board-title .loc { margin-top: 10px; font-size: 12px; line-height: 1.9; color: #4A463C; }
  .bd-dot { position: absolute; left: 76px; top: 420px; width: 14px; height: 14px; border-radius: 50%; background: var(--red); }
  .board-foot { position: absolute; right: 56px; top: 56px; width: 420px; text-align: right; font-size: 10px; letter-spacing: .1em; color: #6B6558; }

  /* ---------- 设备壳：按 assets/ios_frame.jsx 常量移植 ---------- */
  .phone { width: 417px; height: 876px; padding: 12px; background: #000; border-radius: 60px; box-shadow: 0 0 0 2px #1f2937, 0 30px 70px rgba(26,26,24,.28); position: relative; }
  .screen { position: relative; width: 393px; height: 852px; border-radius: 48px; overflow: hidden; background: var(--paper); }
  .sbar {
    position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 20; color: var(--ink);
    display: flex; align-items: center; justify-content: space-between; padding: 0 32px;
    font: 600 16px/1 -apple-system, "SF Pro Text", sans-serif; pointer-events: none;
  }
  .island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; background: #000; border-radius: 999px; z-index: 30; }
  .content { position: absolute; top: 54px; left: 0; right: 0; bottom: 90px; overflow: hidden; }
  .home { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 140px; height: 5px; border-radius: 999px; background: rgba(0,0,0,.3); z-index: 10; }
  .sicons { display: flex; align-items: center; gap: 6px; }
  .sig { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
  .sig i { width: 3px; background: currentColor; border-radius: 1px; display: block; }
  .bat { width: 26px; height: 12px; border: 1.5px solid currentColor; border-radius: 3px; padding: 1px; position: relative; opacity: .8; }
  .bat b { display: block; width: 85%; height: 100%; background: currentColor; border-radius: 1px; opacity: .9; }
  .bat::after { content: ""; position: absolute; top: 3px; right: -3px; width: 2px; height: 6px; background: currentColor; border-radius: 0 1px 1px 0; }

  .scr { display: none; height: 100%; }
  .scr.on { display: block; }

  /* ---------- S1 海报首屏 ---------- */
  .s1 { position: relative; height: 100%; }
  .s1 .comp { position: absolute; left: 0; top: 0; right: 0; height: 246px; overflow: hidden; }
  .s1 .red { position: absolute; left: 0; top: 0; width: 196px; height: 180px; background: var(--red); }
  .s1 .red i { position: absolute; left: 48px; top: 40px; width: 96px; height: 96px; border-radius: 50%; background: var(--paper); display: block; }
  .s1 .ink { position: absolute; left: 196px; top: 0; width: 197px; height: 180px; background: var(--ink); }
  .s1 .ink i { position: absolute; left: 0; top: 90px; width: 66px; height: 66px; border-radius: 0 66px 0 0; background: var(--yel); display: block; }
  .s1 .ink b { position: absolute; left: 84px; top: 96px; width: 46px; height: 46px; border-radius: 50% 0 0 0; background: var(--blue); display: block; }
  .s1 .strip { position: absolute; left: 0; top: 180px; width: 100%; height: 66px; background: var(--yel); }
  .s1 .bars { position: absolute; left: 0; top: 246px; width: 100%; height: 0; }
  .s1 .bars span { position: absolute; top: 0; width: 22px; height: 22px; background: var(--ink); }

  .s1 h2 {
    position: absolute; left: 26px; top: 300px; font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
    font-size: 96px; font-weight: 900; letter-spacing: .04em; line-height: 1;
  }
  .s1 .meta { position: absolute; left: 28px; top: 424px; font-size: 13px; line-height: 2.1; color: #4A463C; }
  .s1 .go {
    position: absolute; left: 28px; top: 536px; width: 62px; height: 62px; border-radius: 50%; background: var(--red);
    border: 0; cursor: pointer; transition: transform .2s;
  }
  .s1 .go:hover { transform: scale(1.08); }
  .s1 .go span { position: absolute; left: 80px; top: 20px; font-size: 11px; letter-spacing: .2em; white-space: nowrap; color: #4A463C; }

  /* ---------- S2 三条路 ---------- */
  .s2 { padding: 24px 26px 0; }
  .s2 .cap { font-size: 10px; letter-spacing: .3em; color: #6B6558; }
  .s2 h3 { font-family: "Noto Serif SC", "Songti SC", SimSun, serif; font-size: 30px; font-weight: 900; margin-top: 12px; line-height: 1.3; }
  .rt { margin-top: 26px; cursor: pointer; }
  .rt .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; }
  .rt .nm { font-size: 14px; font-weight: 600; }
  .rt .mo { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 13px; }
  .rt .bar { height: 14px; margin-top: 9px; }
  .rt .bar i { display: block; height: 100%; transition: width .4s; }
  .rt .c { font-size: 11px; color: #6B6558; margin-top: 8px; }
  .rt:hover .nm { text-decoration: underline; text-underline-offset: 3px; }
  .s2 .note { margin-top: 22px; font-size: 11px; line-height: 1.9; color: #6B6558; border-top: 1px solid #D5CCB8; padding-top: 14px; }

  /* ---------- S3 时间轴 ---------- */
  .s3 { padding: 24px 22px 0; }
  .s3 .cap { font-size: 10px; letter-spacing: .3em; color: #6B6558; }
  .s3 h3 { font-family: "Noto Serif SC", "Songti SC", SimSun, serif; font-size: 24px; font-weight: 900; margin-top: 10px; line-height: 1.4; }
  .axis { position: relative; margin: 46px 6px 0; height: 2px; background: var(--ink); }
  .axis .tk { position: absolute; top: -5px; width: 10px; height: 10px; background: var(--paper); border: 2px solid var(--ink); border-radius: 50%; }
  .axis .tk.on { background: var(--red); border-color: var(--red); }
  .axis .lab { position: absolute; top: -30px; font-family: ui-monospace, monospace; font-size: 10px; color: #4A463C; }
  .nodes { margin-top: 30px; }
  .nd { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #D5CCB8; }
  .nd .dot { width: 10px; height: 10px; margin-top: 6px; background: var(--ink); flex: none; }
  .nd.r .dot { background: var(--red); }
  .nd .t { font-size: 12px; font-weight: 600; }
  .nd .d { font-size: 11px; color: #4A463C; margin-top: 4px; line-height: 1.7; }
  .s3 .dead { margin-top: 20px; font-size: 12px; }
  .s3 .dead b { background: var(--red); color: var(--paper); padding: 3px 8px; font-weight: 500; }

  /* ---------- S4 今天 ---------- */
  .s4 { padding: 30px 26px 0; position: relative; }
  .s4 .cap { font-size: 10px; letter-spacing: .3em; color: #6B6558; }
  .s4 .big { display: flex; align-items: flex-end; gap: 10px; margin-top: 26px; }
  .s4 .big b { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 118px; line-height: .82; color: var(--red); font-weight: 700; }
  .s4 .big span { font-size: 12px; letter-spacing: .2em; color: #4A463C; padding-bottom: 8px; }
  .s4 p { font-size: 15px; line-height: 1.95; margin-top: 24px; }
  .s4 .why { font-size: 11px; color: #6B6558; line-height: 1.9; margin-top: 16px; border-top: 1px solid #D5CCB8; padding-top: 14px; }
  .s4 .done { margin-top: 24px; width: 100%; background: var(--ink); color: var(--paper); border: 0; font: inherit; font-size: 13px; letter-spacing: .26em; padding: 15px 0; cursor: pointer; transition: background .2s; }
  .s4 .done:hover { background: var(--red); }

  /* ---------- tab ---------- */
  .tabbar { position: absolute; left: 0; right: 0; bottom: 34px; height: 56px; display: flex; align-items: center; justify-content: space-around; border-top: 1px solid #D5CCB8; background: var(--paper); }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
  .tab i { width: 18px; height: 4px; background: #C4BAA4; display: block; transition: background .2s; }
  .tab span { font-size: 9px; letter-spacing: .2em; color: #7A7364; }
  .tab.on i { background: var(--red); }
  .tab.on span { color: var(--ink); }

  /* ---------- 板上的手机 ---------- */
  .pwrap { position: absolute; transform-origin: top left; }
  .plabel { position: absolute; font-size: 10px; color: #6B6558; letter-spacing: .18em; white-space: nowrap; }
</style>
</head>
<body>

<div class="bd-shape bd-red"></div>
<div class="bd-shape bd-blue"></div>
<div class="bd-shape bd-yel"></div>
<div class="bd-shape bd-bar"></div>
<div class="bd-shape bd-bar b2"></div>
<div class="bd-shape bd-bar b3"></div>
<div class="bd-shape bd-bar b4"></div>

<div class="board-title">
  <h1>重开</h1>
  <div class="sub">RESTART — 方向二 · 几何</div>
  <div class="loc">米纸、朱红、墨黑、靛蓝。<br>圆与方重新拼一次。</div>
</div>
<div class="bd-dot"></div>
<div class="board-foot">演示数据：虚构人物 28 岁产品经理 · 方法：田中一光的几何拼贴，色块即信息</div>

<div id="stage"></div>

<template id="tpl-home">
  <div class="scr" data-name="home">
    <div class="s1">
      <div class="comp">
        <div class="red"><i></i></div>
        <div class="ink"><i></i><b></b></div>
        <div class="strip"></div>
      </div>
      <div class="bars">
        <span style="left:0"></span><span style="left:34px"></span><span style="left:68px"></span>
        <span style="left:102px"></span><span style="left:136px"></span><span style="left:170px"></span>
      </div>
      <h2>重开</h2>
      <div class="meta">28 岁 · 存款六万<br>每周 12 小时 · 房贷 4,200</div>
      <button class="go" data-go="route"><span>开始算</span></button>
    </div>
  </div>
</template>

<template id="tpl-route">
  <div class="scr" data-name="route">
    <div class="s2">
      <div class="cap">三条路 · 代价对比</div>
      <h3>长度就是代价。</h3>
      <div class="rt" data-go="time">
        <div class="top"><span class="nm">转行做独立开发</span><span class="mo">14 个月</span></div>
        <div class="bar"><i style="width:78%;background:var(--red)"></i></div>
        <div class="c">收入降到 40% · 需要先补 3 个月缓冲</div>
      </div>
      <div class="rt" data-go="time">
        <div class="top"><span class="nm">改成远程，慢慢做</span><span class="mo">18 个月</span></div>
        <div class="bar"><i style="width:100%;background:var(--blue)"></i></div>
        <div class="c">收入不变 · 18 个月里不能换赛道</div>
      </div>
      <div class="rt" data-go="time">
        <div class="top"><span class="nm">先休息三个月</span><span class="mo">3 个月</span></div>
        <div class="bar"><i style="width:17%;background:var(--yel)"></i></div>
        <div class="c">现金流 −2.4 万 · 换一次清醒的判断</div>
      </div>
      <div class="note">三条路都不是免费的。这一页只做一件事：把代价排成可以比较的长度。</div>
    </div>
  </div>
</template>

<template id="tpl-time">
  <div class="scr" data-name="time">
    <div class="s3">
      <div class="cap">路线二 · 时间轴</div>
      <h3>不转行，把现在的工作改成远程</h3>
      <div class="axis">
        <div class="tk on" style="left:0"></div>
        <div class="lab" style="left:-4px">0</div>
        <div class="tk" style="left:70px"></div>
        <div class="lab" style="left:64px">3</div>
        <div class="tk" style="left:180px"></div>
        <div class="lab" style="left:172px">9</div>
        <div class="tk" style="left:320px"></div>
        <div class="lab" style="left:310px">18 月</div>
      </div>
      <div class="nodes">
        <div class="nd r"><div class="dot"></div><div><div class="t">现在 · 把 12 小时固定下来</div><div class="d">三个晚上，不排别的事</div></div></div>
        <div class="nd"><div class="dot"></div><div><div class="t">第 3 个月 · 谈远程，出第一个原型</div><div class="d">代价：谈判可能失败，失败就退回路线一</div></div></div>
        <div class="nd"><div class="dot"></div><div><div class="t">第 9 个月 · 第一个付费用户</div><div class="d">代价：收入增长很慢，容易怀疑</div></div></div>
        <div class="nd"><div class="dot"></div><div><div class="t">第 18 个月 · 决定留还是走</div><div class="d">代价：这 18 个月里不能换赛道</div></div></div>
      </div>
      <div class="dead">最晚决定点 <b>明年 3 月</b></div>
    </div>
  </div>
</template>

<template id="tpl-today">
  <div class="scr" data-name="today">
    <div class="s4">
      <div class="cap">今天只做这一件</div>
      <div class="big"><b>20</b><span>分钟</span></div>
      <p>写下你在工作里真正做过瘾的三件事。</p>
      <div class="why">AI 的判断：你的钱够 5.4 个月，先确认方向再加速，比先加速再纠偏便宜。</div>
      <button class="done" data-go="route">记下了</button>
    </div>
  </div>
</template>

<script>
  const PHONES = [
    { initial: 'home',  scale: .56, x: 330,  y: 330, label: '一　海报首屏' },
    { initial: 'route', scale: .62, x: 605,  y: 308, label: '二　三条路·长度即代价' },
    { initial: 'time',  scale: .56, x: 906,  y: 330, label: '三　时间轴' },
    { initial: 'today', scale: .56, x: 1155, y: 330, label: '四　今天' },
  ];
  if (window.innerWidth < 1440) PHONES[3].x = 1155;

  const TABS = [
    { key: 'home', label: '开始' },
    { key: 'route', label: '三条路' },
    { key: 'time', label: '时间轴' },
    { key: 'today', label: '今天' },
  ];

  const stage = document.getElementById('stage');

  function buildPhone(cfg) {
    const wrap = document.createElement('div');
    wrap.className = 'pwrap';
    wrap.style.left = cfg.x + 'px';
    wrap.style.top = cfg.y + 'px';
    wrap.style.transform = `scale(${cfg.scale})`;

    const phone = document.createElement('div');
    phone.className = 'phone';
    phone.innerHTML = `
      <div class="screen">
        <div class="sbar"><span>9:41</span>
          <div class="sicons">
            <div class="sig"><i style="height:4px"></i><i style="height:6px"></i><i style="height:9px"></i><i style="height:11px"></i></div>
            <div class="bat"><b></b></div>
          </div>
        </div>
        <div class="island"></div>
        <div class="content"></div>
        <div class="tabbar"></div>
        <div class="home"></div>
      </div>`;

    const content = phone.querySelector('.content');
    ['home', 'route', 'time', 'today'].forEach((k) => content.appendChild(document.getElementById('tpl-' + k).content.cloneNode(true)));

    const scr = content.querySelectorAll('.scr');
    const show = (name) => {
      scr.forEach((s) => s.classList.toggle('on', s.dataset.name === name));
      phone.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.tab === name));
    };

    const tabbar = phone.querySelector('.tabbar');
    TABS.forEach((t) => {
      const b = document.createElement('div');
      b.className = 'tab';
      b.dataset.tab = t.key;
      b.innerHTML = '<i></i><span>' + t.label + '</span>';
      b.addEventListener('click', () => show(t.key));
      tabbar.appendChild(b);
    });

    phone.querySelectorAll('[data-go]').forEach((el) => {
      el.addEventListener('click', (e) => { e.stopPropagation(); show(el.dataset.go); });
    });

    show(cfg.initial);
    wrap.appendChild(phone);
    return wrap;
  }

  PHONES.forEach((cfg) => {
    stage.appendChild(buildPhone(cfg));
    const label = document.createElement('div');
    label.className = 'plabel';
    label.textContent = cfg.label;
    label.style.left = cfg.x + 'px';
    label.style.top = (cfg.y + 876 * cfg.scale + 14) + 'px';
    stage.appendChild(label);
  });
</script>
</body>
</html>
